<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinDash">
  <title>Finance Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- No ES modules. Four reliable UMD builds via script tags. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05070d;--bg2:#0e1421;--bg3:#161d2e;
      --border:#1d2742;--border2:#2a3660;
      --gold:#f0b429;--gold2:#ffd166;--gold-bg:rgba(240,180,41,.1);
      --green:#34d399;--green-bg:rgba(52,211,153,.1);
      --red:#f87171;--red-bg:rgba(248,113,113,.1);
      --blue:#60a5fa;--purple:#a78bfa;
      --text:#e6ecf7;--muted:#7a8bab;--dim:#1d2742;
      --mono:'Space Mono',monospace;--sans:'Outfit',system-ui,sans-serif;
      --nav-h:68px;
      --shadow:0 12px 30px -16px rgba(0,0,0,.7);
    }
    html{-webkit-text-size-adjust:100%}
    html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    body{background:radial-gradient(120% 360px at 50% -90px,#111b31 0%,var(--bg) 70%) no-repeat,var(--bg)}
    #app{max-width:520px;margin:0 auto;min-height:100dvh}
    /* calc() needs whitespace around + and - or the whole declaration is dropped */
    .page{padding:calc(env(safe-area-inset-top) + 18px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);animation:fadeUp .22s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(6,9,17,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border);display:flex;z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px 0;transition:color .2s;-webkit-tap-highlight-color:transparent}
    .nav-btn.active{color:var(--gold)}
    .nav-icon{font-size:19px;line-height:1;padding:4px 16px;border-radius:999px;transition:background .25s}
    .nav-btn.active .nav-icon{background:var(--gold-bg)}
    .nav-label{font-size:11px;font-weight:600;letter-spacing:.02em}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 45%),var(--bg2);border:1px solid var(--border);border-radius:20px;padding:18px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
    .card-sm{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0) 50%),var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .page-title{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
    .sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin:22px 0 10px}
    .big-num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--gold);letter-spacing:-.03em;line-height:1}
    .med-num{font-family:var(--mono);font-size:19px;font-weight:700;line-height:1}
    .sm-num{font-family:var(--mono);font-size:15px;line-height:1}
    .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
    .tag-gold{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(240,180,41,.25)}
    .tag-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,.25)}
    .tag-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.25)}
    .tag-blue{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
    .tag-purple{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.25)}

    .htbl tr:last-child td{border-bottom:none;color:var(--gold);font-weight:700}

    .h-in{background:var(--bg3);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:16px;padding:8px 8px;width:100%;min-width:0;-webkit-appearance:none}

    .btn-g{background:var(--gold-bg);border:1px solid rgba(240,180,41,.35);color:var(--gold);border-radius:12px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;display:block;text-align:center}
    .btn-n{background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:12px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;display:block;text-align:center}
    /* Device lock + first-run screens */
    .gate{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;overflow-y:auto}
    .gate-in{background:var(--bg3);border:1px solid var(--border2);border-radius:14px;color:var(--text);font-family:var(--mono);font-size:24px;letter-spacing:.4em;padding:14px;text-align:center;width:210px;-webkit-appearance:none}
    .gate-in:focus{outline:none;border-color:var(--gold)}
    .gate-w{width:100%;max-width:360px}
    .demo-b{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-bg);border:1px solid rgba(240,180,41,.3);color:var(--gold);border-radius:14px;padding:10px 12px 10px 14px;font-size:13px;font-weight:600;margin-bottom:16px}
    .demo-b button{background:var(--gold);color:var(--bg);border:none;border-radius:9px;padding:7px 11px;font-family:var(--sans);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
    .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:6px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:var(--sans)}
    .live i{width:7px;height:7px;border-radius:50%;display:inline-block}
    .ph{border-radius:0 16px 16px 0;padding:14px 14px 14px 16px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-left-width:3px}
    .ib{background:linear-gradient(135deg,var(--gold-bg),rgba(240,180,41,.13));border:1px solid rgba(240,180,41,.3);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .ib-btn{background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:9px 16px;font-family:var(--sans);font-size:14px;font-weight:800;cursor:pointer}
    .ldg{display:flex;align-items:center;justify-content:center;height:100dvh;flex-direction:column;gap:14px}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .ldg-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1s ease infinite}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
    @media(max-width:360px){
      .page{padding-left:12px;padding-right:12px}
      .g4{grid-template-columns:1fr 1fr}
      .big-num{font-size:30px}
      .si-in{width:120px}
    }
  </style>
</head>
<body>
<div id="app"><div class="ldg"><div class="ldg-dot"></div><span style="color:#5a6a88;font-size:13px;font-family:sans-serif">Loading…</span></div></div>
<script>
// ─── Wire up globals ───────────────────────────────────────────
// React 18, Chart.js 4, htm — all loaded as UMD script tags above

// Adapter: lets us write class="" and style="string" like normal HTML
// and silently converts them to what React needs.
function parseStyle(str) {
  var o = {};
  str.split(';').forEach(function(r) {
    var i = r.indexOf(':');
    if (i < 0) return;
    var k = r.slice(0,i).trim().replace(/-([a-z])/g, function(_,c){return c.toUpperCase();});
    var v = r.slice(i+1).trim();
    if (k && v) o[k] = v;
  });
  return o;
}
function h() {
  var type = arguments[0], props = arguments[1];
  if (props != null && typeof type === 'string') {
    if (props['class'] != null) { props.className = props['class']; delete props['class']; }
    if (typeof props.style === 'string') props.style = parseStyle(props.style);
  }
  return React.createElement.apply(React, arguments);
}
var html     = htm.bind(h);
var useState  = React.useState;
var useEffect = React.useEffect;
var useRef    = React.useRef;
var useMemo   = React.useMemo;
var Fragment  = React.Fragment;

// ─── Constants ────────────────────────────────────────────────
var SKEY = 'findash_v5';
var WKEY = 'findash_seen';   // welcome screen dismissed — separate from saved data
var EXP  = 0.22;           // 22% expense ratio: mgmt ~8% + rates + insurance + maintenance
var PC   = ['#f0b429','#34d399','#60a5fa','#a78bfa'];
var CUR_YR = new Date().getFullYear();

Chart.defaults.font.family = "'Outfit', system-ui, sans-serif";
Chart.defaults.color = '#7a8bab';

// ─── Dates ────────────────────────────────────────────────────
// Ages and payoff horizons are stored as calendar months ('YYYY-MM'), not as
// "40 years old" / "168 months to go". A relative number never moves, so the
// countdowns would read the same every day the app is opened.
function ym(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function ymParse(v){
  var m=/^(\d{4})-(\d{1,2})$/.exec(String(v||'').trim());
  if(!m||+m[2]<1||+m[2]>12) return null;
  return new Date(+m[1],+m[2]-1,1);
}
function ymAdd(months){ var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+months); return ym(d); }
function monthsUntil(d){ var n=new Date(); return Math.max(0,(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth()); }
// Calendar-accurate years / months / days between now and a future date
function ymdUntil(to){
  var now=new Date(); now.setHours(0,0,0,0);
  if(to<=now) return [0,0,0];
  var y=to.getFullYear()-now.getFullYear(), m=to.getMonth()-now.getMonth(), d=to.getDate()-now.getDate();
  if(d<0){ m--; d+=new Date(to.getFullYear(),to.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  return [y,m,d];
}
function ago(ts){
  if(!ts) return '';
  var s=Math.round((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.round(s/60)+'m ago';
  if(s<86400) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}

// Derived view of saved state: real age and months-to-debt-free, computed
// from the stored dates so every tab sees figures that move with time.
function derive(s){
  var dob=ymParse(s.dob), df=ymParse(s.dfDate), now=new Date();
  var age=dob?Math.floor(((now.getFullYear()-dob.getFullYear())*12+now.getMonth()-dob.getMonth())/12):(s.age||0);
  return Object.assign({},s,{age:age,dfMonths:df?monthsUntil(df):(s.dfMonths||0)});
}

// ─── Seed historical snapshots from purchase year to this year ─
function seedSnaps(p) {
  var n = CUR_YR - p.yr;
  // A property bought this year has no history to seed, but still needs one
  // row so the charts and tables have something to draw.
  if (n <= 0) {
    var aR0 = p.rent * 52, ex0 = Math.round(aR0 * EXP), ic0 = Math.round(p.loan * 0.061);
    return [{ year:p.yr, value:p.cost, wRent:p.rent, aRent:aR0, loan:p.loan, exp:ex0, intC:ic0,
              grossY: p.cost?+(aR0/p.cost*100).toFixed(3):0,
              netY:   p.cost?+((aR0-ex0-ic0)/p.cost*100).toFixed(3):0,
              equity: p.cost-p.loan }];
  }
  var vgr = Math.pow(p.val / p.cost, 1/n) - 1;
  var initRent = p.rent / Math.pow(1.035, n);
  var initLoan = p.cost * 0.78;
  var out = [];
  for (var i = 0; i <= n; i++) {
    var yr    = p.yr + i;
    var val   = Math.round(p.cost * Math.pow(1+vgr, i));
    var wRent = Math.round(initRent * Math.pow(1.035, i));
    var aRent = wRent * 52;
    var loan  = Math.max(p.loan, Math.round(initLoan * Math.pow(0.92, i)));
    var exp   = Math.round(aRent * EXP);
    var intC  = Math.round(loan * 0.061);
    out.push({ year:yr, value:val, wRent:wRent, aRent:aRent, loan:loan, exp:exp, intC:intC,
               grossY: +(aRent/val*100).toFixed(3),
               netY:   +((aRent-exp-intC)/val*100).toFixed(3),
               equity: val-loan });
  }
  return out;
}

// ─── DEMO DATA ────────────────────────────────────────────────
// Sample data that ships with the public app. Nobody's real figures live in
// this file — personal data is entered on-device and kept in localStorage.
//
// The sample profile is a 40-year-old on median Australian numbers, so the
// dashboard opens on something recognisable rather than invented figures:
//   Salary       $90,500  — ABS median full-time weekly earnings $1,741 (May 2025)
//   Super        $130,000 — ASFA average balance, ages 35–44
//   SG rate      12%      — legislated rate since 1 July 2025
//   Home value   $800,000 — CoreLogic national median dwelling value
//   Home loan    $320,000 — remaining on a 2015 purchase
//   Target       $78,566  — ASFA Retirement Standard, 'comfortable', couple
//
// The sample person owns a home and no investment properties, which is the
// ordinary case — most Australians own none. The Properties tab starts empty
// with an "Add investment property" button.
var PROPS_RAW = [];

// Sample holdings — modest balances outside super, totalling the figures in
// DEFAULT below. Replace them in Settings, or import your own data file.
var DEMO_CRYPTO = [
  {t:'BTC', n:'Bitcoin',   v:1800,g:0,qty:0.012},
  {t:'ETH', n:'Ethereum',  v:900, g:0,qty:0.25},
  {t:'SOL', n:'Solana',    v:300, g:0,qty:2},
];
var DEMO_US = [
  {t:'AAPL',n:'Apple',    u:3500,g:0,qty:14},
  {t:'GOOG',n:'Alphabet', u:2800,g:0,qty:12},
  {t:'AMZN',n:'Amazon',   u:1700,g:0,qty:8},
];
var DEMO_ASX = [
  {t:'NDQ.AX',n:'Betashares NASDAQ',  v:9000,g:0,trust:false,qty:150,px:60.00},
  {t:'VAS.AX',n:'Vanguard Aus Shares',v:6000,g:0,trust:false,qty:60, px:100.00},
];

var DEFAULT = {
  demo:true, schema:2,
  ownerName:'My Dashboard',
  // The sample person is always 40 and always 14 years from paying off the home.
  dob:ymAdd(-480), retAge:60, superAge:60, salary:90500,
  dfDate:ymAdd(168), target:78566,
  pprName:'Primary Residence', pprAddr:'', pprNote:'',
  pprBoughtYr:2015, pprBoughtCost:560000, pprReno:30000,
  pprVal:800000, pprLoan:320000, pprRate:6.09, totalLoan:0, loanRate:6.09,
  expRatio:22, rentGrow:3.5, propGrow:5.0,
  superBal:130000, superContrib:10860, superGrow:7.0,
  audusd:0.698, invGrow:7.0,
  holdUS:DEMO_US, holdASX:DEMO_ASX, holdCrypto:DEMO_CRYPTO,
  props: PROPS_RAW.map(function(p){return Object.assign({},p,{snaps:seedSnaps(p)});}),

// ─── Holdings ─────────────────────────────────────────────────
// Share and crypto values are always units × latest price, so the Invest tab,
// net worth and every projection read the same number.
//   US     {t, n, qty, px (USD), u (USD value — older saves)}
//   ASX    {t, n, qty, px (AUD), v (AUD value — older saves), trust}
//   Crypto {t, n, qty, px (AUD), v (AUD value — older saves)}
// m:true marks a holding with no ticker (cash, a managed fund): it is never
// priced live, its value is simply qty × px.
var KINDS = [
  {id:'us',     key:'holdUS',     label:'US Shares',  cur:'USD', col:'#f0b429', ph:'AAPL'},
  {id:'asx',    key:'holdASX',    label:'ASX Shares', cur:'AUD', col:'#34d399', ph:'VAS'},
  {id:'crypto', key:'holdCrypto', label:'Crypto',     cur:'AUD', col:'#a78bfa', ph:'BTC'},
];
var CGIDS={BTC:'bitcoin',ETH:'ethereum',SOL:'solana',BNB:'binancecoin',XRP:'ripple',ADA:'cardano',DOGE:'dogecoin',
  DOT:'polkadot',AVAX:'avalanche-2',LINK:'chainlink',LTC:'litecoin',TRX:'tron',XLM:'stellar',ATOM:'cosmos',
  POL:'polygon-ecosystem-token',MATIC:'polygon-ecosystem-token',SHIB:'shiba-inu',UNI:'uniswap',NEAR:'near',
  SUI:'sui',TON:'the-open-network',HBAR:'hedera-hashgraph',USDT:'tether',USDC:'usd-coin'};

function asxSym(t){ t=String(t||'').toUpperCase().trim(); return !t?'':/\.AX$/.test(t)?t:t+'.AX'; }
function pxKey(kind,h){
  if(!h||h.m||!h.t) return null;
  var t=String(h.t).toUpperCase().trim();
  return kind==='crypto'?(CGIDS[t]?'c:'+t:null):kind==='asx'?'a:'+asxSym(t):'u:'+t;
}
function basePx(kind,h){
  if(h.px>0) return h.px;
  var q=+h.qty||0; if(!q) return 0;
  return kind==='us'?(+h.u||0)/q:(+h.v||0)/q;
}
function quote(kind,h,mk){ var k=pxKey(kind,h), q=k&&mk&&mk.px[k]; return q&&q.p>0?q:null; }
function fxOf(mk,s){ return (mk&&mk.fx>0)?mk.fx:(s&&s.audusd>0?s.audusd:0.65); }   // USD per AUD
// AUD value of one holding
function holdVal(kind,h,mk,s){
  var q=quote(kind,h,mk), v=(+h.qty||0)*(q?q.p:basePx(kind,h));
  return kind==='us'?v/fxOf(mk,s):v;
}
function invTotals(s,mk){
  var o={us:0,asx:0,crypto:0,day:0,live:0,count:0};
  KINDS.forEach(function(k){
    (s[k.key]||[]).forEach(function(h){
      var v=holdVal(k.id,h,mk,s), q=quote(k.id,h,mk);
      o[k.id]+=v; o.count++;
      if(q){ o.live++; if(q.c) o.day+=v-v/(1+q.c/100); }
    });
  });
  o.total=o.us+o.asx+o.crypto;
  return o;
}

// ─── Live prices ──────────────────────────────────────────────
// Prices are cached on the device, so the last good figures survive a reload,
// a flaky connection or a backgrounded PWA. Only ticker symbols are sent to
// the price services — never quantities, balances or anything about you.
var PXKEY='findash_px';
function loadMarket(){
  try{ var m=JSON.parse(localStorage.getItem(PXKEY)); if(m&&m.px) return m; }catch(e){}
  return {px:{},fx:0,ts:0,src:0};
}
function getJSON(url,ms){
  var ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var t=setTimeout(function(){ if(ctl) ctl.abort(); },ms||9000);
  return fetch(url,ctl?{signal:ctl.signal}:{})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .finally(function(){ clearTimeout(t); });
}
// Yahoo Finance sends no CORS headers, so a browser cannot read it directly.
// Try direct first (in case that changes), then public CORS relays, starting
// with whichever relay worked last time.
var RELAYS=[
  function(u){ return u; },
  function(u){ return 'https://corsproxy.io/?url='+encodeURIComponent(u); },
  function(u){ return 'https://api.allorigins.win/raw?url='+encodeURIComponent(u); },
  function(u){ return 'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u); },
];
function yahooQuote(sym,start){
  var url='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(sym)+'?interval=1d&range=1d';
  function attempt(n){
    if(n>=RELAYS.length) return Promise.reject(new Error('no price for '+sym));
    var idx=(start+n)%RELAYS.length;
    return getJSON(RELAYS[idx](url),8000).then(function(d){
      var m=((((d||{}).chart||{}).result||[])[0]||{}).meta||{};
      if(!(m.regularMarketPrice>0)) throw new Error('empty');
      var prev=m.previousClose||m.chartPreviousClose;
      return {p:m.regularMarketPrice,c:prev?(m.regularMarketPrice-prev)/prev*100:0,src:idx};
    }).catch(function(){ return attempt(n+1); });
  }
  return attempt(0);
}
function refreshMarket(s,prev){
  var next={px:Object.assign({},prev.px),fx:prev.fx,ts:prev.ts,src:prev.src||0,got:0,want:0};
  var now=Date.now(), jobs=[];

  var coins={};
  (s.holdCrypto||[]).forEach(function(h){ var k=pxKey('crypto',h); if(k) coins[k.slice(2)]=CGIDS[k.slice(2)]; });
  var coinTs=Object.keys(coins);
  if(coinTs.length){
    next.want+=coinTs.length;
    jobs.push(getJSON('https://api.coingecko.com/api/v3/simple/price?vs_currencies=aud&include_24hr_change=true&ids='+
      coinTs.map(function(t){return coins[t];}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(','))
      .then(function(d){
        coinTs.forEach(function(t){ var r=d[coins[t]]; if(r&&r.aud>0){ next.px['c:'+t]={p:r.aud,c:r.aud_24h_change||0,ts:now}; next.got++; } });
      }));
  }

  jobs.push(getJSON('https://api.frankfurter.dev/v1/latest?base=USD&symbols=AUD')
    .catch(function(){ return getJSON('https://api.frankfurter.app/latest?from=USD&to=AUD'); })
    .then(function(d){ var a=d&&d.rates&&d.rates.AUD; if(a>0) next.fx=1/a; }));

  var syms={};
  (s.holdUS||[]).forEach(function(h){ var k=pxKey('us',h); if(k) syms[k]=k.slice(2); });
  (s.holdASX||[]).forEach(function(h){ var k=pxKey('asx',h); if(k) syms[k]=k.slice(2); });
  Object.keys(syms).forEach(function(k){
    next.want++;
    jobs.push(yahooQuote(syms[k],next.src).then(function(r){ next.px[k]={p:r.p,c:r.c,ts:now}; next.src=r.src; next.got++; }));
  });

  return Promise.all(jobs.map(function(j){ return j.catch(function(){}); })).then(function(){
    if(next.got) next.ts=now;
    try{ localStorage.setItem(PXKEY,JSON.stringify({px:next.px,fx:next.fx,ts:next.ts,src:next.src})); }catch(e){}
    return next;
  });
}

// ─── Upgrading older saves ────────────────────────────────────
// Before schema 2, share and crypto totals were typed into Settings separately
// from the holdings lists, and age / debt-free were relative numbers. Turn
// those into holdings and dates without changing anyone's net worth.
function sameList(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
function migrate(d){
  if(!d||typeof d!=='object'||d.schema>=2) return d;
  d=Object.assign({},d);
  function manual(n,val,extra){ return Object.assign({t:'',n:n,qty:1,px:Math.round(val),m:true},extra||{}); }
  function fix(key,demo,demoTot,rows){
    var tot=rows.reduce(function(a,r){return a+(+r[1]||0);},0);
    var list=d[key];
    var stale=Array.isArray(list)&&sameList(list,demo)&&Math.abs(tot-demoTot)>1;
    if(!Array.isArray(list)||stale)
      d[key]=rows.filter(function(r){return +r[1]>0;}).map(function(r){return manual(r[0],+r[1],r[2]);});
  }
  fix('holdUS',DEMO_US,8000,[['US shares',d.usUSD]]);
  fix('holdASX',DEMO_ASX,15000,[['ASX shares',d.asxP],['ASX shares (trust)',d.asxT,{trust:true}]]);
  fix('holdCrypto',DEMO_CRYPTO,3000,[['Crypto',d.crypto]]);
  if(!d.dob)    d.dob=(CUR_YR-(+d.age||40))+'-01';
  if(!d.dfDate) d.dfDate=ymAdd(+d.dfMonths||0);
  d.schema=2;
  return d;
}

// ─── Device lock ──────────────────────────────────────────────
// IMPORTANT: this is a privacy screen, not encryption. It stops someone
// who picks up your unlocked phone from reading the dashboard. It does not
// protect against anyone with developer tools, and it is not what keeps your
// data off the internet — that is handled by keeping personal figures out of
// this file entirely, so the published app has nothing private to leak.
var PKEY = 'findash_pin';
function pinHash(pin){
  var h=5381, str='findash:'+pin;
  for(var i=0;i<str.length;i++) h=((h*33)^str.charCodeAt(i))>>>0;
  return String(h);
}
function getPin(){ try{return localStorage.getItem(PKEY);}catch(e){return null;} }
function savePin(pin){ try{ pin?localStorage.setItem(PKEY,pinHash(pin)):localStorage.removeItem(PKEY); }catch(e){} }
function checkPin(pin){ return getPin()===pinHash(pin); }

// ─── Backup / restore ─────────────────────────────────────────
// Your real numbers travel as a file you keep yourself — never through the repo.
function exportData(s){
  var blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download='findash-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
}
function importData(file,onDone){
  var r=new FileReader();
  r.onload=function(){
    var d;
    try{ d=JSON.parse(r.result); }catch(e){ alert("That file isn't valid JSON."); return; }
    if(!d||typeof d!=='object'||!Array.isArray(d.props)){ alert("That doesn't look like a dashboard backup."); return; }
    // DEFAULT fills in fields the file predates, but its sample home loan must
    // not be inherited — a backup with no pprLoan means no home loan, not $320k.
    onDone(Object.assign({},DEFAULT,{pprLoan:0},migrate(d),{demo:false}));
  };
  r.onerror=function(){ alert("Couldn't read that file."); };
  r.readAsText(file);
}

// Anything the user saves is their own data, never a sample — stamp demo:false
// or the loader would discard it as a stale sample snapshot.
function saveState(next){
  var n=Object.assign({},next,{demo:false,updatedAt:Date.now()});
  delete n.age; delete n.dfMonths;   // derived from dob / dfDate on every load
  try{ localStorage.setItem(SKEY,JSON.stringify(n)); }catch(e){ alert("Couldn't save — your browser storage may be full or disabled."); }
  return n;
}

// Number input that keeps its own draft, so a field can be emptied while
// typing instead of snapping to 0 on every keystroke. Commits valid numbers.
function NumIn(p){
  var _d=useState(String(p.value==null?'':p.value)); var d=_d[0],setD=_d[1];
  var focused=useRef(false);
  useEffect(function(){ if(!focused.current) setD(String(p.value==null?'':p.value)); },[p.value]);
  return html`<input class=${p.cls||'si-in'} type="number" inputMode="decimal" step=${p.step||'any'} value=${d} placeholder=${p.ph||''}
    style=${p.style||''}
    onFocus=${function(){focused.current=true;}}
    onBlur=${function(){ focused.current=false; if(d===''||isNaN(parseFloat(d))) setD(String(p.value==null?'':p.value)); }}
    onInput=${function(e){ var v=e.target.value; setD(v); var n=parseFloat(v); if(!isNaN(n)) p.onChange(n); }} />`;
}

// ─── Helpers ──────────────────────────────────────────────────
function ff(n){ return '$'+Math.round(n||0).toLocaleString('en-AU'); }
function fm(n){ if(!n||isNaN(n))return'$0'; if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M'; if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'k'; return'$'+Math.round(n); }
function pc(n){ return(n>=0?'+':'')+(n||0).toFixed(1)+'%'; }
function cc(n){ return n>=0?'var(--green)':'var(--red)'; }

// ─── Financial calculations ───────────────────────────────────
function calc(s,mk) {
  var gr = s.props.reduce(function(a,p){return a+p.rent*52;},0);
  // Investment debt is the sum of each property's own loan; the old single
  // "investment loans" figure only applies to saves with no properties listed.
  var il = s.props.length?s.props.reduce(function(a,p){return a+(+p.loan||0);},0):(s.totalLoan||0);
  var nr = gr*(1-s.expRatio/100) - il*s.loanRate/100;
  var ipV= s.props.reduce(function(a,p){return a+p.val;},0);
  var pV = ipV+s.pprVal;
  // il is investment-property debt: it reduces equity and is charged
  // against rental income. pprLoan is the home mortgage — it reduces equity
  // but must not be charged against rent, or a person with a home and no
  // rentals shows negative "passive income".
  var hl = s.pprLoan||0;
  var debt=il+hl;
  var pE = pV-debt;
  var it = invTotals(s,mk);
  var inv= it.total;
  var nw = pE+s.superBal+inv;
  var yR = Math.max(0,s.retAge-s.age);
  var yS = Math.max(0,s.superAge-s.age);
  var now= new Date();
  var dob= ymParse(s.dob);
  var rd = dob?new Date(dob.getFullYear()+(+s.retAge||0),dob.getMonth(),1):new Date(now.getFullYear()+yR,now.getMonth(),1);
  var dd = ymParse(s.dfDate)||new Date(now.getFullYear(),now.getMonth()+s.dfMonths,1);
  var rC = ymdUntil(rd), dC = ymdUntil(dd);
  var r  = s.superGrow/100;
  var sp = Array.from({length:21},function(_,i){
    var f=r?(Math.pow(1+r,i)-1)/r:i;
    return Math.round(s.superBal*Math.pow(1+r,i)+s.superContrib*f);
  });
  var sa = sp[Math.min(yS,20)];
  var dfY= s.dfMonths/12;
  // Debt runs down evenly to zero at the debt-free date
  function left(i){ return dfY>0?Math.max(0,1-i/dfY):0; }
  var pp = Array.from({length:16},function(_,i){
    return Math.round(gr*Math.pow(1+s.rentGrow/100,i)*(1-s.expRatio/100)-il*left(i)*s.loanRate/100);
  });
  var nwp= Array.from({length:21},function(_,i){
    return Math.round(pV*Math.pow(1+s.propGrow/100,i)-debt*left(i)+sp[Math.min(i,20)]+inv*Math.pow(1+s.invGrow/100,i));
  });
  return {il:il,gr:gr,nr:nr,pV:pV,ipV:ipV,pE:pE,inv:inv,it:it,nw:nw,hl:hl,debt:debt,
    yR:yR,yS:yS,sa:sa,sp:sp,pp:pp,nwp:nwp,
    gY:ipV?gr/ipV*100:0, pNow:s.target?Math.min(100,Math.max(0,nr/s.target*100)):0,
    pPost:s.target?Math.min(100,Math.max(0,pp[Math.min(Math.ceil(dfY),15)]/s.target*100)):0,
    rd:rd,dd:dd,
    rYr:rC[0],rMo:rC[1],rDy:rC[2],
    dYr:dC[0],dMo:dC[1],dDy:dC[2],
    retP:pp[Math.min(yR,15)], retNW:nwp[Math.min(yR,20)]};
}

// ─── Chart helpers ────────────────────────────────────────────
function mkOpts(yf) {
  return {responsive:true,maintainAspectRatio:false,
    interaction:{intersect:false,mode:'index'},
    plugins:{legend:{display:false},
      tooltip:{backgroundColor:'#1a2038',titleColor:'#8892b0',borderColor:'#1e2a45',borderWidth:1,
               callbacks:{label:function(ctx){return ' '+(ctx.dataset.label||'')+' '+yf(ctx.raw);}}}},
    scales:{
      y:{ticks:{color:'#7a8bab',font:{family:"'Space Mono', ui-monospace, monospace",size:11},callback:yf,maxTicksLimit:6},grid:{color:'#1a2340'},border:{display:false}},
      x:{ticks:{color:'#7a8bab',font:{size:12},maxTicksLimit:7,maxRotation:0},grid:{display:false},border:{display:false}}
    }};
}
function useChart(factory,deps) {
  var r=useRef(null),ch=useRef(null);
  useEffect(function(){
    if(!r.current)return;
    if(ch.current)ch.current.destroy();
    ch.current=factory(r.current);
    return function(){if(ch.current)ch.current.destroy();};
  },deps);
  return r;
}

// Live-price status — tap to refresh
function LivePill(p){
  var st=p.status, ts=p.mkt.ts;
  var col=st==='live'?'var(--green)':st==='loading'?'var(--muted)':st==='partial'?'var(--blue)':'var(--gold)';
  var txt=st==='loading'?'Updating…'
    :st==='live'?'Live · '+ago(ts)
    :st==='partial'?'Partly live · '+ago(ts)
    :st==='none'?'No live prices'
    :ts?'Offline · '+ago(ts):'Offline';
  return html`<button class="live" style="color:${col}" onClick=${p.onRefresh} title="Refresh prices">
    <i style="background:${col};${st==='loading'||st==='live'?'animation:pulse 1.6s ease infinite':''}"></i>${txt}
    <span style="color:var(--muted);font-size:14px;line-height:1;${st==='loading'?'animation:spin 1s linear infinite;display:inline-block':''}">↻</span>
  </button>`;
}

// ─── TAB: OVERVIEW ────────────────────────────────────────────
function TabOverview(p) {

function TabPortfolio(p) {

    return Array.from({length:M-m+1},function(_,i){return m+i;});
  },[s.props]);
  var yf = met==='value'||met==='equity'
    ?function(v){return v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+(v/1e3).toFixed(0)+'k';}

        <${MultiLine} datasets=${ds} labels=${allYrs} yFmt=${yf} />
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px">

        var bw=Math.min(100,p.grossY/8*100),bn=6/8*100;
        return html`<div class="card" style="margin-bottom:8px">

function Drilldown(p) {
  var prop=p.prop,col=p.col,onBack=p.onBack,onSave=p.onSave,onRemove=p.onRemove,rate=p.rate>0?p.rate:6.09;
  var ct=useState('value');var setCt=ct[1];ct=ct[0];
  var sf=useState(false);var setSf=sf[1];sf=sf[0];
  var snaps=prop.snaps,lbls=snaps.map(function(s){return String(s.year);});
  var yoy=snaps.map(function(s,i){return i===0?0:+((s.value-snaps[i-1].value)/snaps[i-1].value*100).toFixed(2);});
  var lat=snaps[snaps.length-1]||{};
  var fm_=useState({year:CUR_YR,value:prop.val,wRent:prop.rent,loan:prop.loan,exp:Math.round(prop.rent*52*EXP)});
  var setFm=fm_[1];fm_=fm_[0];
  var vf=function(v){return v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+(v/1e3).toFixed(0)+'k';};
  var pf=function(v){return(v||0).toFixed(2)+'%';};
  function submit(){
    var yr=+fm_.year,v=+fm_.value,wr=+fm_.wRent,ln=+fm_.loan,ex=+fm_.exp;
    if(!(yr>=1900&&yr<=2100)||!(v>0)||!(wr>=0)||!(ln>=0)||!(ex>=0)){alert('Enter a valid year, a value above zero, and no negative amounts.');return;}
    var aR=wr*52,int=Math.round(ln*rate/100);
    onSave(prop.id,{year:yr,value:v,wRent:wr,aRent:aR,loan:ln,exp:ex,intC:int,
      grossY:+(aR/v*100).toFixed(3),netY:+((aR-ex-int)/v*100).toFixed(3),equity:v-ln});
    setSf(false);
  }
  return html`
    <div class="page">
      <button class="back" onClick=${onBack}>‹ Back to Properties</button>
      <div class="fb" style="margin-bottom:14px">
        <div><div style="font-size:22px;font-weight:800;color:${col}">${prop.name}</div><div style="font-size:13px;color:var(--muted)">${prop.addr} · ${prop.suburb} · Bought ${prop.yr}</div></div>
        <button onClick=${function(){setSf(!sf);}} style="background:${sf?'var(--bg3)':'var(--gold)'};color:${sf?'var(--muted)':'var(--bg)'};border:none;border-radius:8px;padding:7px 12px;font-family:var(--sans);font-size:14px;font-weight:800;cursor:pointer">${sf?'✕ Cancel':'+ Update'}</button>
      </div>

      <div class="card">
        <div class="g4">
          ${[['Value',ff(lat.value||prop.val),'var(--gold)'],['Yield',(lat.grossY||0).toFixed(2)+'%','var(--blue)'],['Net Y',(lat.netY||0).toFixed(2)+'%','var(--purple)'],['Equity',fm(lat.equity||prop.val-prop.loan),'var(--green)']].map(function(r){
            return html`<div class="sb" style="text-align:center"><div class="lbl" style="font-size:11px">${r[0]}</div><div style="font-family:var(--mono);font-size:14px;color:${r[2]};font-weight:700;margin-top:3px">${r[1]}</div></div>`;
          })}
        </div>
        <div class="div" style="margin:10px 0 8px"></div>
        <div class="g3">
          ${[['Purchase',ff(prop.cost),'var(--muted)'],['Capital Gain','+'+ff(prop.val-prop.cost),'var(--green)'],['Rent','$'+prop.rent+'/wk','var(--text)']].map(function(r){
            return html`<div class="sb"><div class="lbl" style="font-size:11px">${r[0]}</div><div style="font-family:var(--mono);font-size:14px;color:${r[2]};margin-top:2px">${r[1]}</div></div>`;
          })}
        </div>
      </div>

      ${sf && html`
        <div class="snap">
          <div style="font-weight:800;font-size:15px;color:var(--gold);margin-bottom:10px">Log Annual Snapshot</div>
          ${[['Year','year','1'],['Property Value','value','1000'],['Weekly Rent','wRent','5'],['Loan Balance','loan','1000'],['Annual Expenses','exp','500']].map(function(r){
            return html`<div class="snap-row">
              <div style="font-size:14px">${r[0]}</div>
              <input class="snap-in" type="number" step=${r[2]} value=${fm_[r[1]]}
                onInput=${function(e){var k=r[1];setFm(function(f){var n=Object.assign({},f);n[k]=e.target.value;return n;});}} />
            </div>`;
          })}
          <button class="snap-btn" onClick=${submit}>✓ Save Snapshot</button>
        </div>
      `}

      <div class="card" style="margin-top:6px">
        <div class="pills">
          ${[['value','Value Growth'],['yield','Yield Trend'],['equity','Equity Build'],['growth','Growth pa']].map(function(t){
            return html`<button class=${'pill'+(ct===t[0]?' on':'')} onClick=${function(){setCt(t[0]);}}>${t[1]}</button>`;
          })}
        </div>
        ${ct==='value' && html`<${LineChart} data=${snaps.map(function(s){return s.value;})} labels=${lbls} color=${col} yFmt=${vf} />`}
        ${ct==='yield' && html`
          <${DualLine} d1=${snaps.map(function(s){return s.grossY;})} d2=${snaps.map(function(s){return s.netY;})} l1="Gross" l2="Net" labels=${lbls} c1=${col} c2="var(--green)" yFmt=${pf} />
          <div style="display:flex;gap:14px;margin-top:8px">
            <div style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)"><div style="width:14px;height:2px;background:${col};border-radius:1px"></div>Gross yield</div>
            <div style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted)"><div style="width:14px;height:2px;background:var(--green);border-radius:1px"></div>Net yield</div>
          </div>`}
        ${ct==='equity' && html`<${LineChart} data=${snaps.map(function(s){return s.equity;})} labels=${lbls} color="var(--green)" yFmt=${vf} />`}
        ${ct==='growth' && html`<${BarChart} data=${yoy} labels=${lbls} yFmt=${pf} />`}
      </div>

      <div class="sec">Year-by-Year History</div>
      <div class="hwrap">
        <table class="htbl">
          <thead><tr><th>Year</th><th>Value</th><th>Rent/wk</th><th>Gross Y</th><th>Net Y</th><th>Equity</th><th>YoY</th></tr></thead>
          <tbody>
            ${snaps.slice().reverse().map(function(sn,i,arr){
              var yv=i<arr.length-1?pc(yoy[snaps.length-1-i]):'—';
              var yc=i<arr.length-1&&yoy[snaps.length-1-i]>=0?'var(--green)':'var(--red)';
              return html`<tr>
                <td>${sn.year}</td>
                <td style="color:var(--gold)">${ff(sn.value)}</td>
                <td>$${sn.wRent}</td>
                <td style="color:var(--blue)">${sn.grossY.toFixed(2)}%</td>

                <td style="color:${yc}">${yv}</td>
              </tr>`;
            })}
          </tbody>
        </table>
      </div>

      ${onRemove && html`<button class="btn-d" style="margin-top:16px" onClick=${onRemove}>🗑  Remove This Property</button>`}
    </div>`;
}

var NEW_PROP={name:'',suburb:'',addr:'',yr:String(new Date().getFullYear()),cost:'',val:'',rent:'',loan:'',trust:false};

function TabProperties(p) {
  var s=p.s,setS=p.setS;
  var sel=useState(null);var setSel=sel[1];sel=sel[0];
  var _af=useState(false);var addOpen=_af[0],setAddOpen=_af[1];
  var _nf=useState(NEW_PROP);var nf=_nf[0],setNf=_nf[1];
  var sp=sel?s.props.find(function(x){return x.id===sel;}):null;
  var si=sel?s.props.findIndex(function(x){return x.id===sel;}):-1;

  function persist(next){ setS(saveState(next)); }

  function addProp(){
    var yr=parseInt(nf.yr,10), cost=parseFloat(nf.cost), val=parseFloat(nf.val),
        rent=parseFloat(nf.rent), loan=parseFloat(nf.loan)||0;
    if(!nf.name.trim())            { alert('Give the property a name.'); return; }
    if(!yr||yr<1900||yr>2100)      { alert('Enter a valid purchase year.'); return; }
    if(!(cost>0))                  { alert('Enter the purchase price.'); return; }
    if(!(val>0))                   { alert('Enter the current value.'); return; }
    if(!(rent>=0)||isNaN(rent))    { alert('Enter the weekly rent (0 if vacant).'); return; }
    var raw={ id:Date.now(), name:nf.name.trim(), suburb:nf.suburb.trim(), addr:nf.addr.trim(),
              yr:yr, cost:cost, val:val, rent:rent, loan:loan, trust:!!nf.trust };
    var next=Object.assign({},s,{demo:false,props:s.props.concat([Object.assign({},raw,{snaps:seedSnaps(raw)})])});
    persist(next); setNf(NEW_PROP); setAddOpen(false);
  }

  function removeProp(pid){
    var victim=s.props.find(function(x){return x.id===pid;});
    if(!confirm('Remove "'+(victim?victim.name:'this property')+'" and its history? This cannot be undone.')) return;
    persist(Object.assign({},s,{props:s.props.filter(function(x){return x.id!==pid;})}));
    setSel(null);
  }
  function onSave(pid,sn){
    var next=Object.assign({},s,{props:s.props.map(function(x){
      if(x.id!==pid)return x;
      var f=x.snaps.filter(function(z){return z.year!==sn.year;});
      var ss=f.concat([sn]).sort(function(a,b){return a.year-b.year;});
      // Only the newest snapshot moves the property's headline figures
      var latest=sn.year>=ss[ss.length-1].year;
      return Object.assign({},x,{snaps:ss,val:latest?sn.value:x.val,rent:latest?sn.wRent:x.rent,loan:latest?sn.loan:x.loan});
    })});

var LKEY='findash_loan';
var FREQ={weekly:{ppy:52,suf:'/wk',lbl:'Weekly'},fortnightly:{ppy:26,suf:'/fn',lbl:'Fortnightly'},monthly:{ppy:12,suf:'/mo',lbl:'Monthly'}};
// Walk the schedule period by period; returns periods taken, total interest
// and the balance at each year end (for the chart).
function amortize(P,pr,ppy,pay,maxN){
  var bal=P,tot=0,k=0,yearly=[Math.round(P)];
  while(bal>0.005&&k<maxN){ var i=bal*pr; tot+=i; bal=Math.max(0,bal+i-pay); k++; if(k%ppy===0) yearly.push(Math.round(bal)); }
  if(k%ppy!==0) yearly.push(Math.round(bal));
  return {periods:k,interest:tot,yearly:yearly};
}
function loanCalc(l){
  var P=Math.max(0,+l.amt||0), rate=Math.max(0,+l.rate||0), extra=Math.max(0,+l.extra||0);
  var yrs=Math.min(40,Math.max(1,Math.round(+l.years)||1)), f=FREQ[l.freq]||FREQ.monthly;
  var n=yrs*f.ppy, pr=rate/100/f.ppy;
  var pay=P>0?(pr>0?P*pr/(1-Math.pow(1+pr,-n)):P/n):0;
  var base=amortize(P,pr,f.ppy,pay,n);
  var ex=extra>0&&P>0?amortize(P,pr,f.ppy,pay+extra,n):null;
  return {P:P,f:f,pay:pay,base:base,ex:ex,extra:extra};
}
function yrmo(m){ var y=Math.floor(m/12),r=m%12; return (y?y+' yr ':'')+(r||!y?r+' mo':''); }

        : html`<${LineChart} data=${r.base.yearly} labels=${lbls} color="#f0b429" yFmt=${vf} />`}

    <div style="font-size:12px;color:var(--muted);text-align:center;padding:4px 0">Estimate only — ignores fees, offset accounts and rate changes.</div>
  </div>`;
}

// ─── TAB: PLAN (Forecast · Loan · Settings) ──────────────────
function TabPlan(p) {
  var s=p.s,setS=p.setS,c=p.c,seg=p.seg,setSeg=p.setSeg;
  var _hp=useState(function(){return !!getPin();});var hasPin=_hp[0],setHasPin=_hp[1];
  var _pd=useState('');var pinDraft=_pd[0],setPinDraft=_pd[1];
  var l20=Array.from({length:21},function(_,i){return"'"+String(CUR_YR+i).slice(2);});
  var l15=Array.from({length:16},function(_,i){return"'"+String(CUR_YR+i).slice(2);});
  function save(n){ setS(saveState(n)); }
  function set(k,v){ var o={}; o[k]=v; save(Object.assign({},s,o)); }
  var hasIP=s.props.length>0;
  var dOpt={month:'short',year:'numeric'};
  var fp={s:s,set:set};
  return html`
    <div class="page">
      <div class="page-title">Plan</div>
      <div class="pills">
        ${[['fc','Forecast'],['loan','Home loan'],['set','Settings']].map(function(t){

        })}
      </div>

      ${seg==='loan' && html`<${LoanCalc} s=${s} set=${set} />`}

      ${seg==='fc' && html`<div>
        <div class="card" style="background:linear-gradient(135deg,var(--gold-bg),rgba(52,211,153,.04)),var(--bg2);border-color:rgba(240,180,41,.3)">
          <div class="lbl" style="color:var(--gold)">At retirement · age ${s.retAge}</div>
          <div class="big-num" style="margin-top:8px">${fm(c.retNW)}</div>
          <div style="font-size:13px;color:var(--muted);margin-top:6px">Projected net worth in ${c.yR} years (${c.rd.toLocaleDateString('en-AU',dOpt)})</div>
          <div class="div"></div>
          <div class="g3">
            ${[['Super @'+s.superAge,fm(c.sa),'var(--blue)'],hasIP?['Rent / yr',fm(Math.max(0,c.retP)),'var(--green)']:['Shares',fm(c.inv*Math.pow(1+s.invGrow/100,c.yR)),'var(--green)'],['Target / yr',fm(s.target),'var(--text)']].map(function(r){
              return html`<div class="sb"><div class="lbl" style="font-size:11px">${r[0]}</div><div style="font-family:var(--mono);font-size:15px;color:${r[2]};font-weight:700">${r[1]}</div></div>`;
            })}
          </div>
        </div>

        <div class="card">
          <div class="fb"><div><div style="font-weight:800;font-size:16px">Net worth</div><div style="font-size:13px;color:var(--muted);margin-top:2px">Next 20 years</div></div><div class="sm-num" style="color:var(--gold);font-weight:700">${fm(c.nwp[20])}</div></div>
          <${LineChart} data=${c.nwp} labels=${l20} color="#f0b429" yFmt=${function(v){return'$'+(v/1e6).toFixed(1)+'M';}} />
        </div>

        <div class="card">
          <div class="fb"><div><div style="font-weight:800;font-size:16px">Super</div><div style="font-size:13px;color:var(--muted);margin-top:2px">${s.superGrow}% a year · access at ${s.superAge}</div></div><div class="sm-num" style="color:var(--blue);font-weight:700">${fm(c.sa)}</div></div>
          <${LineChart} data=${c.sp} labels=${l20} color="#60a5fa" yFmt=${function(v){return v>=1e6?'$'+(v/1e6).toFixed(1)+'M':'$'+Math.round(v/1e3)+'k';}} />
        </div>

        ${hasIP && html`<div class="card">
          <div class="fb"><div><div style="font-weight:800;font-size:16px">Rental income</div><div style="font-size:13px;color:var(--muted);margin-top:2px">Rent +${s.rentGrow}%/yr · ${s.expRatio}% expenses</div></div><div class="sm-num" style="color:var(--green);font-weight:700">${fm(c.pp[15])}/yr</div></div>
          <${LineChart} data=${c.pp} labels=${l15} color="#34d399" yFmt=${function(v){return'$'+Math.round(v/1e3)+'k';}} />
        </div>`}

        <div class="sec">Milestones</div>
        ${[
          {col:'var(--red)',  title:'Debt free',   tgt:c.debt>0?c.dd.toLocaleDateString('en-AU',dOpt):'Done', desc:c.debt>0?'Clear '+fm(c.debt)+' of loans':'No loans outstanding'},
          {col:'var(--gold)', title:'Retire',      tgt:'Age '+s.retAge, desc:'Target '+fm(s.target)+'/yr of income'},
          {col:'var(--blue)', title:'Super access',tgt:'Age '+s.superAge, desc:'Projected balance '+fm(c.sa)},
        ].map(function(x){
          return html`<div class="ph" style="border-left-color:${x.col}">
            <div class="fb" style="gap:12px">
              <div><div style="font-weight:800;font-size:16px">${x.title}</div><div style="font-size:13px;color:var(--muted);margin-top:3px">${x.desc}</div></div>
              <div style="font-family:var(--mono);font-size:14px;color:${x.col};white-space:nowrap;font-weight:700">${x.tgt}</div>
            </div>
          </div>`;
        })}
        <div style="font-size:12px;color:var(--muted);text-align:center;padding:10px 4px 0;line-height:1.5">
          Projections use property ${s.propGrow}%, investments ${s.invGrow}% and super ${s.superGrow}% growth a year — change them in Settings.
        </div>
      </div>`}

      ${seg==='set' && html`<div>
        ${s.demo && html`<div class="demo-b"><span>Editing any figure turns the samples into your own data.</span></div>`}
        <div class="card">
          <div class="set-h" style="color:var(--gold)">YOU</div>
          <${SetText} ...${fp} label="Dashboard name" k="ownerName" ph="My Dashboard" />
          <${SetMonth} ...${fp} label="Born" hint=${'Age '+s.age} k="dob" />
          <${SetNum} ...${fp} label="Retirement age" k="retAge" />
          <${SetNum} ...${fp} label="Super access age" k="superAge" />
          <${SetNum} ...${fp} label="Salary" k="salary" />
          <${SetNum} ...${fp} label="Income target ($/yr)" k="target" />
        </div>
        <div class="card">
          <div class="set-h" style="color:var(--gold)">HOME</div>
          <${SetText} ...${fp} label="Label" k="pprName" ph="Primary Residence" />
          <${SetText} ...${fp} label="Address" k="pprAddr" ph="Optional" />
          <${SetNum} ...${fp} label="Current value" k="pprVal" />
          <${SetNum} ...${fp} label="Year bought" k="pprBoughtYr" />
          <${SetNum} ...${fp} label="Purchase price" k="pprBoughtCost" />
          <${SetNum} ...${fp} label="Renovations" k="pprReno" />
          <${SetNum} ...${fp} label="Home loan balance" k="pprLoan" />
          <${SetNum} ...${fp} label="Home loan rate (%)" k="pprRate" step="0.01" />
          <${SetMonth} ...${fp} label="Debt-free by" hint=${c.debt>0?s.dfMonths+' months away':'No loans'} k="dfDate" />
        </div>
        <div class="card">
          <div class="set-h" style="color:var(--blue)">SUPER</div>
          <${SetNum} ...${fp} label="Balance" k="superBal" />
          <${SetNum} ...${fp} label="Contributions ($/yr)" k="superContrib" />
          <${SetNum} ...${fp} label="Growth (%/yr)" k="superGrow" step="0.1" />
        </div>
        <div class="card">
          <div class="set-h" style="color:var(--green)">INVESTMENTS</div>
          <div class="note" style="margin-bottom:6px">Shares and crypto are edited as holdings on the <b style="color:var(--text)">Invest</b> tab.</div>
          <${SetNum} ...${fp} label="Growth (%/yr)" k="invGrow" step="0.1" />
          <${SetNum} ...${fp} label="AUD/USD fallback" hint="Used when the live rate is unavailable" k="audusd" step="0.001" />
        </div>
        <div class="card">
          <div class="set-h" style="color:var(--purple)">INVESTMENT PROPERTY</div>
          ${!hasIP && s.totalLoan>0 && html`<${SetNum} ...${fp} label="Investment loans" hint="Add properties to track loans individually" k="totalLoan" />`}
          ${hasIP && html`<div class="note" style="padding:6px 0">Loans are taken from each property — update them on the <b style="color:var(--text)">Properties</b> tab.</div>`}
          <${SetNum} ...${fp} label="Loan rate (%)" k="loanRate" step="0.01" />
          <${SetNum} ...${fp} label="Expenses (% of rent)" k="expRatio" step="0.5" />
          <${SetNum} ...${fp} label="Rent growth (%/yr)" k="rentGrow" step="0.1" />
          <${SetNum} ...${fp} label="Property growth (%/yr)" k="propGrow" step="0.1" />
        </div>

        <div class="sec">Privacy & backup</div>
        <div class="card">
          <div class="note">Your figures are stored only in this browser on this device and are never uploaded. The app itself is public — anyone with the link gets sample numbers.</div>
          <div style="display:flex;gap:8px">
            <button class="btn-n" onClick=${function(){exportData(s);}}>⤓ Export</button>
            <label class="btn-n" style="cursor:pointer">⤒ Import
              <input type="file" accept="application/json,.json" style="display:none" onChange=${function(e){
                var f=e.target.files&&e.target.files[0]; e.target.value='';
                if(f) importData(f,function(next){ save(next); alert('Data imported.'); });
              }} />
            </label>
          </div>
          <div class="div"></div>
          <div class="si-l" style="font-weight:700">Device PIN</div>
          <div class="note" style="margin-top:4px">${hasPin?'A PIN is needed to open the dashboard on this device.':'A privacy screen for a shared phone. It is not encryption.'}</div>
          ${hasPin
            ? html`<button class="btn-n" onClick=${function(){ if(confirm('Remove the PIN? The dashboard will open without one.')){savePin(null);setHasPin(false);} }}>Remove PIN</button>`
            : html`<div style="display:flex;gap:8px;align-items:center;margin-top:10px">
                <input class="si-in" style="flex:1;width:auto;text-align:left;letter-spacing:.2em" type="password" inputMode="numeric" placeholder="4–8 digits"
                  value=${pinDraft} onInput=${function(e){setPinDraft(e.target.value.replace(/\D/g,'').slice(0,8));}} />
                <button class="chip gold" style="padding:11px 18px" onClick=${function(){
                  if(pinDraft.length<4){alert('Use at least 4 digits.');return;}
                  savePin(pinDraft);setPinDraft('');setHasPin(true);
                  alert('PIN set. You can clear it here, or reset the app if you forget it.');
                }}>Set</button>
              </div>`}
        </div>
        <button class="btn-d" onClick=${function(){if(confirm('Reset everything to the sample data? Export a backup first if you want to keep your figures.')){try{localStorage.removeItem(SKEY);localStorage.removeItem(LKEY);}catch(e){}setS(DEFAULT);}}}>Reset to sample data</button>
      </div>`}
    </div>`;
}

// ─── APP ROOT ─────────────────────────────────────────────────
var TABS = [
  {id:'overview',  icon:'◈',label:'Overview'},
  {id:'portfolio', icon:'◎',label:'Portfolio'},
  {id:'properties',icon:'⬡',label:'Properties'},
  {id:'invest',    icon:'◉',label:'Invest'},
  {id:'plan',      icon:'◬',label:'Plan'},
];

// First run: explains the app to whoever opens the link, and lets the owner
// pull their own figures in from a backup file instead of shipping them in the repo.
function Welcome(p) {
  return html`
    <div class="gate">
      <div class="gate-w">
        <div style="font-size:36px;line-height:1;margin-bottom:12px;color:var(--gold)">◈</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-.02em">Finance Dashboard</div>
        <div style="font-size:15px;color:var(--muted);line-height:1.6;margin:10px 0 22px">
          Track your home, property, shares, crypto and super — with live prices and a retirement countdown.
          Everything you enter stays in this browser on this device — nothing is uploaded, and there's no account to create.
        </div>
        <button class="btn-g" onClick=${p.onDemo}>Explore with sample data</button>
        <label class="btn-n" style="cursor:pointer">
          Import my backup file
          <input type="file" accept="application/json,.json" style="display:none" onChange=${function(e){
            var f=e.target.files&&e.target.files[0]; e.target.value='';
            if(f) importData(f,p.onImport);
          }} />
        </label>
        <div style="font-size:13px;color:var(--muted);margin-top:16px;line-height:1.5">
          The sample figures aren't anyone's real numbers. Replace them in <b style="color:var(--text)">Plan → Settings</b>.
        </div>
      </div>
    </div>`;
}

// Privacy screen for a shared phone — see the note above pinHash().
function Lock(p) {
  var _v=useState('');var v=_v[0],setV=_v[1];
  var _e=useState(false);var err=_e[0],setErr=_e[1];
  function submit(e){
    e.preventDefault();
    if(checkPin(v)) p.onOk(); else { setErr(true); setV(''); }
  }
  return html`
    <div class="gate">
      <div class="gate-w">
        <div style="font-size:30px;line-height:1;margin-bottom:14px">🔒</div>
        <div style="font-weight:800;font-size:18px;margin-bottom:18px">Enter your PIN</div>
        <form onSubmit=${submit} style="display:flex;flex-direction:column;align-items:center">
          <input class="gate-in" type="password" inputMode="numeric" autoFocus value=${v}
            onInput=${function(e){setV(e.target.value.replace(/\D/g,'').slice(0,8));setErr(false);}} />
          <div style="height:18px;font-size:13px;color:var(--red);margin-top:8px">${err?'Incorrect PIN':''}</div>
          <button class="btn-g" style="width:190px" type="submit">Unlock</button>
        </form>
        <button style="background:none;border:none;color:var(--muted);font-size:13px;font-family:var(--sans);margin-top:18px;cursor:pointer;text-decoration:underline"
          onClick=${function(){
            if(confirm('Forgotten PIN?\n\nThe only way back in is to clear this device\'s data and start fresh. You can restore from a backup file afterwards.')){
              try{localStorage.removeItem(SKEY);localStorage.removeItem(PKEY);localStorage.removeItem(WKEY);}catch(e){}
              location.reload();
            }
          }}>Forgotten your PIN?</button>
      </div>
    </div>`;
}

function App() {
  var ss=useState(function(){
    try{
      var d=JSON.parse(localStorage.getItem(SKEY));
      // A stored copy still flagged demo:true is a stale snapshot of an older
      // release's sample data. Discard it and use the current DEFAULT, so the
      // samples always track the shipped version instead of freezing on
      // whatever shipped the day someone first opened the app.
      if(!d||d.demo===true){
        if(d) try{localStorage.removeItem(SKEY);}catch(e){}   // clear the stale snapshot
        return DEFAULT;
      }
      // Merge over DEFAULT so saved data from older versions picks up new fields.
      // Sample-only figures are zeroed first so an existing install never
      // inherits them — an older save with no pprLoan has no home loan.
      var up=migrate(d);
      var out=Object.assign({},DEFAULT,{pprLoan:0,demo:false,updatedAt:0},up);
      if(up!==d) try{localStorage.setItem(SKEY,JSON.stringify(out));}catch(e){}
      return out;
    }catch(e){ return DEFAULT; }
  });
  var s=ss[0],setS=ss[1];
  var _lk=useState(function(){return !!getPin();});var locked=_lk[0],setLocked=_lk[1];
  var _wc=useState(function(){
    try{
      if(localStorage.getItem(WKEY)) return false;
      var d=JSON.parse(localStorage.getItem(SKEY));
      return !d||d.demo===true;   // stale sample counts as "not set up yet"
    }catch(e){ return false; }
  });
  var welcome=_wc[0],setWelcome=_wc[1];
  var ts=useState('overview');var tab=ts[0],setTab=ts[1];
  var _sg=useState('fc');var seg=_sg[0],setSeg=_sg[1];
  var ips=useState(null);var ip=ips[0],setIp=ips[1];
  useEffect(function(){
    function h(e){e.preventDefault();setIp(e);}
    window.addEventListener('beforeinstallprompt',h);
    return function(){window.removeEventListener('beforeinstallprompt',h);};
  },[]);

  // ── Live prices, shared by every tab ──
  var _mk=useState(loadMarket);var mkt=_mk[0],setMkt=_mk[1];
  var _st=useState('idle');var status=_st[0],setStatus=_st[1];
  var sRef=useRef(s); sRef.current=s;
  var mRef=useRef(mkt); mRef.current=mkt;
  var busy=useRef(false), lastTry=useRef(0);
  function refresh(){
    if(busy.current) return;
    busy.current=true; lastTry.current=Date.now(); setStatus('loading');
    refreshMarket(sRef.current,mRef.current).then(function(m){
      busy.current=false; setMkt(m);
      setStatus(!m.want?'none':m.got>=m.want?'live':m.got?'partial':'offline');
    });
  }
  var tickers=KINDS.map(function(k){return (s[k.key]||[]).map(function(h){return pxKey(k.id,h);}).join(',');}).join('|');
  useEffect(function(){ if(!locked&&!welcome) refresh(); },[tickers,locked,welcome]);
  // Phones suspend timers in background tabs and installed apps, so also
  // refresh the moment the app comes back into view.
  var _tk=useState(0);var setTick=_tk[1];
  useEffect(function(){
    var iv=setInterval(function(){ setTick(function(x){return x+1;}); if(!document.hidden&&Date.now()-lastTry.current>300000) refresh(); },30000);
    function vis(){ if(!document.hidden&&Date.now()-lastTry.current>60000) refresh(); }
    document.addEventListener('visibilitychange',vis);
    window.addEventListener('online',vis);
    return function(){ clearInterval(iv); document.removeEventListener('visibilitychange',vis); window.removeEventListener('online',vis); };
  },[]);

  var sx=useMemo(function(){return derive(s);},[s,new Date().getDate()]);
  var mk={px:mkt.px,fx:mkt.fx};
  var c=useMemo(function(){return calc(sx,mk);},[sx,mkt]);
  function onI(){if(!ip)return;ip.prompt();ip.userChoice.then(function(){setIp(null);});}
  function go(t,sg){ if(sg) setSeg(sg); setTab(t); window.scrollTo(0,0); }
  var live={mkt:mkt,status:status,refresh:refresh};
  function renderTab(){
    if(tab==='overview')   return html`<${TabOverview}    s=${sx} c=${c} ip=${ip} onI=${onI} go=${go} ...${live} />`;
    if(tab==='portfolio')  return html`<${TabPortfolio}   s=${sx} />`;
    if(tab==='properties') return html`<${TabProperties}  s=${sx} setS=${setS} />`;
    if(tab==='invest')     return html`<${TabInvest}      s=${sx} setS=${setS} c=${c} mk=${mk} ...${live} />`;
    if(tab==='plan')       return html`<${TabPlan}        s=${sx} setS=${setS} c=${c} seg=${seg} setSeg=${setSeg} />`;
  }
  if(locked) return html`<${Lock} onOk=${function(){setLocked(false);}} />`;
  if(welcome) return html`<${Welcome}
    onDemo=${function(){
      // Only record that the welcome screen was dismissed. Writing the sample
      // data into storage would freeze it, and later releases could never
      // update the figures a visitor sees.
      try{localStorage.setItem(WKEY,'1');}catch(e){}
      setWelcome(false);
    }}
    onImport=${function(next){
      try{localStorage.setItem(SKEY,JSON.stringify(next));localStorage.setItem(WKEY,'1');}catch(e){}
      setS(next); setWelcome(false);
    }} />`;
  return html`
    <div>
      <div key=${tab}>${renderTab()}</div>
      <nav class="nav">
        ${TABS.map(function(t){
          return html`<button class=${'nav-btn'+(tab===t.id?' active':'')} onClick=${function(){go(t.id);}}>
            <span class="nav-icon">${t.icon}</span>
            <span class="nav-label">${t.label}</span>
          </button>`;
        })}
      </nav>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);

if('serviceWorker'in navigator)
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
</script>
</body>
</html>
