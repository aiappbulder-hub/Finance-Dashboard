<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060810">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FinDash">
  <meta name="description" content="Personal finance PWA — property portfolio, investments, super projections, loan calculator, travel tracker and retirement countdown.">
  <title>Trent's Finance Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- No ES modules. Four reliable UMD builds via script tags. -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05070d;--bg2:#0e1421;--bg3:#161d2e;
      --border:#1d2742;--border2:#2a3660;
      --gold:#f0b429;--gold2:#ffd166;--gold-bg:rgba(240,180,41,.1);
      --green:#34d399;--green-bg:rgba(52,211,153,.1);
      --red:#f87171;--red-bg:rgba(248,113,113,.1);
      --blue:#60a5fa;--purple:#a78bfa;
      --text:#e6ecf7;--muted:#7285a5;--dim:#1d2742;
      --mono:'Space Mono',monospace;--sans:'Outfit',sans-serif;
      --nav-h:72px;
      --shadow:0 12px 32px -14px rgba(0,0,0,.65);
    }
    html{-webkit-text-size-adjust:100%}
    html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overflow-x:hidden;width:100%;-webkit-font-smoothing:antialiased}
    body{background:radial-gradient(120% 380px at 50% -80px,#101a30 0%,var(--bg) 70%) no-repeat,var(--bg)}
    #app{width:100%;min-height:100dvh;overflow-x:hidden}
    .page{padding:calc(env(safe-area-inset-top)+16px) 16px calc(var(--nav-h)+env(safe-area-inset-bottom)+24px);animation:fadeUp .25s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .nav{position:fixed;bottom:0;left:0;width:100%;height:calc(var(--nav-h)+env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(6,9,17,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;z-index:100}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--muted);cursor:pointer;padding:8px 0;min-height:56px;transition:color .2s;-webkit-tap-highlight-color:transparent}
    .nav-btn.active{color:var(--gold)}
    .nav-icon{font-size:20px;line-height:1;padding:4px 15px;border-radius:999px;transition:background .25s,transform .25s}
    .nav-btn.active .nav-icon{background:var(--gold-bg);transform:translateY(-1px)}
    .nav-label{font-size:11px;font-weight:600;letter-spacing:.02em}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.025) 0%,rgba(255,255,255,0) 45%),var(--bg2);border:1px solid var(--border);border-radius:20px;padding:18px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
    .card-sm{background:linear-gradient(180deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,0) 50%),var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
    .page-title{font-size:27px;font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
    .sec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin:22px 0 10px}
    .big-num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--gold);letter-spacing:-.02em;line-height:1}
    .med-num{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1}
    .sm-num{font-family:var(--mono);font-size:15px;line-height:1}
    .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
    .tag-gold{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(240,180,41,.25)}
    .tag-green{background:var(--green-bg);color:var(--green);border:1px solid rgba(52,211,153,.25)}
    .tag-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(248,113,113,.25)}
    .tag-blue{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25)}
    .tag-purple{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
    .fb{display:flex;align-items:center;justify-content:space-between}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .sb{display:flex;flex-direction:column;gap:4px}
    .div{height:1px;background:var(--border);margin:14px 0}
    .prg{background:var(--bg3);border-radius:8px;height:8px;overflow:hidden;margin:10px 0}
    .prg-f{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s}
    .nwbar{display:flex;height:6px;border-radius:4px;overflow:hidden;margin:12px 0 10px;gap:2px}
    .nwseg{height:100%;border-radius:2px}
    .cdg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
    .cdu{background:var(--bg3);border-radius:12px;padding:11px 4px;text-align:center}
    .cdn{font-family:var(--mono);font-size:23px;font-weight:700;color:var(--gold);line-height:1}
    .cdl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;letter-spacing:.04em}
    .pills{display:flex;background:var(--bg3);border-radius:12px;padding:4px;gap:3px;margin-bottom:14px}
    .pill{flex:1;padding:10px 4px;border:none;background:none;color:var(--muted);border-radius:9px;font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
    .pill.on{background:var(--bg2);color:var(--gold);box-shadow:0 2px 8px rgba(0,0,0,.5)}
    .mbtn{padding:8px 12px;border-radius:9px;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:700;-webkit-tap-highlight-color:transparent}
    .plc{background:linear-gradient(180deg,rgba(255,255,255,.02) 0%,rgba(255,255,255,0) 50%),var(--bg2);border:1px solid var(--border);border-radius:18px;padding:16px 14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);-webkit-tap-highlight-color:transparent;transition:transform .12s}
    .plc:active{opacity:.75;transform:scale(.985)}
    .pacc{width:4px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:56px}
    .back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:15px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:12px;-webkit-tap-highlight-color:transparent}
    .chwrap{position:relative;height:200px;margin-top:12px}
    .inv-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
    .inv-row:last-child{border-bottom:none}
    .tkr{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--border2);color:var(--muted);padding:3px 7px;border-radius:6px}
    .hwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:10px;border-radius:12px;border:1px solid var(--border)}
    .htbl{width:100%;border-collapse:collapse;min-width:340px}
    .htbl th{color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.03em;text-transform:uppercase;padding:9px 7px;text-align:right;background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap}
    .htbl th:first-child{text-align:left}
    .htbl td{padding:8px 7px;border-bottom:1px solid var(--dim);font-family:var(--mono);text-align:right;font-size:12px;white-space:nowrap}
    .htbl td:first-child{text-align:left;font-family:var(--sans);font-weight:600;font-size:12px;color:var(--muted)}
    .htbl tr:last-child td{border-bottom:none;color:var(--gold);font-weight:700}
    .htbl tr:last-child td:first-child{color:var(--gold)}
    .snap{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:16px;margin-top:8px}
    .snap-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .snap-in{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:16px;padding:9px 12px;width:140px;text-align:right;-webkit-appearance:none}
    .snap-in:focus{outline:none;border-color:var(--gold)}
    .snap-btn{background:var(--gold);color:var(--bg);border:none;border-radius:12px;padding:14px;font-family:var(--sans);font-size:16px;font-weight:800;cursor:pointer;width:100%;margin-top:8px;-webkit-tap-highlight-color:transparent}
    .snap-btn:active{opacity:.85}
    .si{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
    .si:last-child{border-bottom:none}
    .si-in{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:16px;padding:9px 12px;text-align:right;width:130px;-webkit-appearance:none}
    .si-in:focus{outline:none;border-color:var(--gold)}
    .btn-d{background:var(--red-bg);border:1px solid rgba(248,113,113,.3);color:var(--red);border-radius:12px;padding:14px;font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px;-webkit-tap-highlight-color:transparent}
    .ph{border-radius:0 16px 16px 0;padding:14px 14px 14px 16px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-left-width:3px;box-shadow:var(--shadow)}
    .ib{background:linear-gradient(135deg,var(--gold-bg),rgba(240,180,41,.13));border:1px solid rgba(240,180,41,.3);border-radius:16px;padding:14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .ib-btn{background:var(--gold);color:var(--bg);border:none;border-radius:10px;padding:10px 18px;font-family:var(--sans);font-size:14px;font-weight:800;cursor:pointer}
    .ldg{display:flex;align-items:center;justify-content:center;height:100dvh;flex-direction:column;gap:14px}
    @keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
    .ldg-dot{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:pulse 1s ease infinite}
    ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
    /* ─── Travel Tab ─────────────────────────────────────────── */
    .tr-search{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:var(--sans);font-size:16px;padding:12px 14px;margin-bottom:12px;-webkit-appearance:none}
    .tr-search:focus{outline:none;border-color:var(--gold)}
    .tr-search::placeholder{color:var(--muted)}
    .tr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:4px}
    .tr-tile{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 4px 9px;text-align:center;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;position:relative;overflow:hidden}
    .tr-tile:active{opacity:.7;transform:scale(.95)}
    .tr-tile.visited{background:var(--green-bg);border-color:rgba(52,211,153,.4)}
    .tr-tile.wishlist{background:var(--gold-bg);border-color:rgba(240,180,41,.3)}
    .tr-flag{font-size:26px;line-height:1;display:block;margin-bottom:5px}
    .tr-name{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.01em;line-height:1.2;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .tr-tile.visited .tr-name{color:var(--green)}
    .tr-tile.wishlist .tr-name{color:var(--gold)}
    .tr-dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
    .tr-dot.visited{background:var(--green)}
    .tr-dot.wishlist{background:var(--gold)}
    .tr-prg{background:var(--bg3);border-radius:6px;height:6px;overflow:hidden;margin:4px 0 10px;display:flex}
    .tr-prg-v{height:100%;background:var(--green);transition:width .4s}
    .tr-prg-w{height:100%;background:var(--gold);opacity:.6;transition:width .4s}
    /* ─── Privacy Mode ────────────────────────────────────────── */
    .prv-bar{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top)+46px);padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:flex-end;padding-right:12px;z-index:200;pointer-events:none}
    .prv-btn{pointer-events:all;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .2s;line-height:1;box-shadow:var(--shadow)}
    .prv-btn.on{background:var(--gold-bg);border-color:rgba(240,180,41,.4)}
    .prv .big-num,.prv .med-num,.prv .sm-num{filter:blur(7px);user-select:none}
    .prv .chwrap,.prv .nwbar,.prv .tr-prg{filter:blur(8px);pointer-events:none}
    .prv .prg-f{opacity:0}
    /* ─── Spend vs Invest ─────────────────────────────────────── */
    .svi-pre{padding:8px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg3);color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
    .svi-pre.on{background:var(--gold-bg);border-color:rgba(240,180,41,.4);color:var(--gold)}
    /* ─── Manual Price Edit ───────────────────────────────────── */
    .pe-in{background:var(--bg3);border:1px solid var(--gold);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:16px;padding:6px 10px;width:100px;text-align:right;-webkit-appearance:none}
    .pe-in:focus{outline:none}
    .pe-ok{background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:8px 11px;font-family:var(--sans);font-size:13px;font-weight:800;cursor:pointer}
    .pe-cl{background:var(--bg3);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:13px;cursor:pointer}
    .edit-ic{color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;opacity:.5;-webkit-tap-highlight-color:transparent}
    .edit-ic:hover,.edit-ic:active{opacity:1}
    /* ─── EOFY Modal ──────────────────────────────────────────── */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .modal-sheet{background:var(--bg2);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom)+20px);width:100%;max-width:560px;animation:slideUp .25s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
    .modal-handle{width:42px;height:5px;background:var(--border2);border-radius:3px;margin:0 auto 16px}
    /* ─── Refresh btn ─────────────────────────────────────────── */
    .ref-btn{background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:700;padding:7px 11px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .ref-btn:active{opacity:.7}
    /* ─── Small phones ────────────────────────────────────────── */
    @media(max-width:360px){
      .page{padding-left:12px;padding-right:12px}
      .card{padding:16px 14px}
      .g4{grid-template-columns:1fr 1fr;gap:6px}
      .tr-grid{grid-template-columns:repeat(4,1fr);gap:5px}
      .page-title{font-size:24px}
      .big-num{font-size:30px}
    }
    /* ─── Tablet / desktop: centre the phone layout ───────────── */
    @media(min-width:640px){
      #app{max-width:560px;margin:0 auto}
      .nav{max-width:560px;left:calc(50% - 280px)}
      .prv-bar{max-width:560px;left:calc(50% - 280px);right:auto;width:100%}
    }
  </style>
</head>
<body>
<div id="app"><div class="ldg"><div class="ldg-dot"></div><span style="color:#5a6a88;font-size:15px;font-family:sans-serif">Loading…</span></div></div>
<script>
// ─── Wire up globals ───────────────────────────────────────────
// React 18, Chart.js 4, htm — all loaded as UMD script tags above

// Adapter: lets us write class="" and style="string" like normal HTML
// and silently converts them to what React needs.
function parseStyle(str) {
  var o = {};
  str.split(';').forEach(function(r) {
    var i = r.indexOf(':');
    if (i < 0) return;
    var k = r.slice(0,i).trim().replace(/-([a-z])/g, function(_,c){return c.toUpperCase();});
    var v = r.slice(i+1).trim();
    if (k && v) o[k] = v;
  });
  return o;
}
function h() {
  var type = arguments[0], props = arguments[1];
  if (props != null && typeof type === 'string') {
    if (props['class'] != null) { props.className = props['class']; delete props['class']; }
    if (typeof props.style === 'string') props.style = parseStyle(props.style);
  }
  return React.createElement.apply(React, arguments);
}
var html     = htm.bind(h);
var useState  = React.useState;
var useEffect = React.useEffect;
var useRef    = React.useRef;
var useMemo   = React.useMemo;
var Fragment  = React.Fragment;

// ─── Constants ────────────────────────────────────────────────
var SKEY = 'findash_v5';
var EXP  = 0.22;           // 22% expense ratio: mgmt ~8% + rates + insurance + maintenance
var PC   = ['#f0b429','#34d399','#60a5fa','#a78bfa'];

// ─── Seed historical snapshots from purchase year to 2026 ─────
function seedSnaps(p) {
  var n = 2026 - p.yr; if (n <= 0) return [];
  var vgr = Math.pow(p.val / p.cost, 1/n) - 1;
  var initRent = p.rent / Math.pow(1.035, n);
  var initLoan = p.cost * 0.78;
  var out = [];
  for (var i = 0; i <= n; i++) {
    var yr    = p.yr + i;
    var val   = Math.round(p.cost * Math.pow(1+vgr, i));
    var wRent = Math.round(initRent * Math.pow(1.035, i));
    var aRent = wRent * 52;
    var loan  = Math.max(p.loan, Math.round(initLoan * Math.pow(0.92, i)));
    var exp   = Math.round(aRent * EXP);
    var intC  = Math.round(loan * 0.061);
    out.push({ year:yr, value:val, wRent:wRent, aRent:aRent, loan:loan, exp:exp, intC:intC,
               grossY: +(aRent/val*100).toFixed(3),
               netY:   +((aRent-exp-intC)/val*100).toFixed(3),
               equity: val-loan });
  }
  return out;
}

var PROPS_RAW = [
  {id:1,name:'Doveton 1',        suburb:'Doveton',   addr:'1/66 Power Rd',     yr:2003,cost:138000,val:475000,rent:380,loan:25000},
  {id:2,name:'Doveton 2',        suburb:'Doveton',   addr:'2/66 Power Rd',     yr:2011,cost:210000,val:475000,rent:420,loan:25000},
  {id:3,name:'Pakenham',         suburb:'Pakenham',  addr:'6/31 Syme Rd',      yr:2018,cost:350000,val:508000,rent:500,loan:25000},
  {id:4,name:'Reservoir (Trust)',suburb:'Reservoir', addr:'5/29 Macartney St', yr:2014,cost:213000,val:330000,rent:400,loan:25000,trust:true},
];

var DEFAULT = {
  age:45, retAge:55, superAge:60, salary:97000,
  dfMonths:18, target:80000,
  pprVal:550000, totalLoan:100000, loanRate:6.34,
  expRatio:39, rentGrow:3.5, propGrow:5.0,
  superBal:351000, superContrib:11155, superGrow:7.0,
  usUSD:38042, audusd:0.634,
  asxP:9800, asxT:6800, crypto:27000, invGrow:7.0,
  props: PROPS_RAW.map(function(p){return Object.assign({},p,{snaps:seedSnaps(p)});}),
  travel: { visited: [], wishlist: ['TR','ES','PT','MT','AL'] },
  manualPx: {}
};

// Holdings from CSV exports — 14 May 2026
var CRYPTO = [
  {t:'BNB', n:'BNB Chain',      v:13697.83,g:21.06, qty:14.82},
  {t:'BTC', n:'Bitcoin',        v:6563.08, g:0.80,  qty:0.06},
  {t:'ETH', n:'Ethereum',       v:5668.96, g:0.84,  qty:1.82},
  {t:'SOL', n:'Solana',         v:1106.40, g:-59.16,qty:8.83},

// ─── Helpers ──────────────────────────────────────────────────
function ff(n){ return '$'+Math.round(n||0).toLocaleString('en-AU'); }
function fm(n){ if(!n||isNaN(n))return'$0'; if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M'; if(n>=1e3)return'$'+(n/1e3).toFixed(0)+'k'; return'$'+Math.round(n); }
function pc(n){ return(n>=0?'+':'')+(n||0).toFixed(1)+'%'; }
function cc(n){ return n>=0?'var(--green)':'var(--red)'; }

// ─── Financial calculations ───────────────────────────────────
function calc(s) {
  var gr = s.props.reduce(function(a,p){return a+p.rent*52;},0);
  var nr = gr*(1-s.expRatio/100) - s.totalLoan*s.loanRate/100;
  var ipV= s.props.reduce(function(a,p){return a+p.val;},0);
  var pV = ipV+s.pprVal;
  var pE = pV-s.totalLoan;
  var au = s.audusd>0?s.audusd:1;
  var usA= s.usUSD/au;
  var inv= usA+s.asxP+s.asxT+s.crypto;
  var nw = pE+s.superBal+inv;
  var yR = Math.max(0,s.retAge-s.age);
  var yS = Math.max(0,s.superAge-s.age);
  var now= new Date();
  var rd = new Date(now); rd.setFullYear(now.getFullYear()+yR);
  var dd = new Date(now); dd.setMonth(now.getMonth()+s.dfMonths);
  var rtD= Math.max(0,Math.round((rd-now)/864e5));
  var dfD= Math.max(0,Math.round((dd-now)/864e5));
  var r  = s.superGrow/100;
  var sp = Array.from({length:21},function(_,i){
    var cf = r>0?((Math.pow(1+r,i)-1)/r):i;
    return i===0?Math.round(s.superBal):Math.round(s.superBal*Math.pow(1+r,i)+s.superContrib*cf);
  });
  var sa = sp[Math.min(yS,20)];
  var pp = Array.from({length:16},function(_,i){
    return Math.round(gr*Math.pow(1+s.rentGrow/100,i)*(1-s.expRatio/100)-(i<s.dfMonths/12?s.totalLoan*s.loanRate/100:0));
  });
  var nwp= Array.from({length:21},function(_,i){
    return Math.round(pV*Math.pow(1+s.propGrow/100,i)-Math.max(0,s.totalLoan*Math.pow(.88,i))+sp[Math.min(i,20)]+inv*Math.pow(1+s.invGrow/100,i));
  });
  return {gr:gr,nr:nr,pV:pV,ipV:ipV,pE:pE,usA:usA,inv:inv,nw:nw,
    yR:yR,sa:sa,sp:sp,pp:pp,nwp:nwp,
    gY:gr/ipV*100, pNow:Math.min(100,nr/s.target*100),
    pPost:Math.min(100,pp[Math.ceil(s.dfMonths/12)]/s.target*100),
    rd:rd,dd:dd,
    rYr:Math.floor(rtD/365),rMo:Math.floor((rtD%365)/30),rDy:rtD%30,
    dYr:Math.floor(dfD/365),dMo:Math.floor((dfD%365)/30),dDy:dfD%30,
    retP:pp[Math.min(yR,15)], retNW:nwp[Math.min(yR,20)]};
}

// ─── Chart helpers ────────────────────────────────────────────
function mkOpts(yf) {
  return {responsive:true,maintainAspectRatio:false,
    interaction:{intersect:false,mode:'index'},
    plugins:{legend:{display:false},
      tooltip:{backgroundColor:'#1a2038',titleColor:'#8892b0',borderColor:'#1e2a45',borderWidth:1,
               callbacks:{label:function(ctx){return ' '+(ctx.dataset.label||'')+' '+yf(ctx.raw);}}}},
    scales:{
      y:{ticks:{color:'#5a6a88',font:{family:"'Space Mono'",size:11},callback:yf},grid:{color:'#1c2540'},border:{display:false}},
      x:{ticks:{color:'#5a6a88',font:{size:11},maxTicksLimit:8},grid:{display:false},border:{display:false}}
    }};
}
function useChart(factory,deps) {
  var r=useRef(null),ch=useRef(null);
  useEffect(function(){
    if(!r.current)return;
    if(ch.current)ch.current.destroy();
    ch.current=factory(r.current);
    return function(){if(ch.current)ch.current.destroy();};
  },deps);
  return r;
}

function LineChart(p) {
  var yf=p.yFmt||function(v){return v;};
  var ref=useChart(function(c){return new Chart(c,{type:'line',
    data:{labels:p.labels,datasets:[{data:p.data,borderColor:p.color||'#f0b429',
          backgroundColor:(p.color||'#f0b429')+'18',fill:true,tension:.4,pointRadius:0,pointHoverRadius:5,borderWidth:2}]},
    options:mkOpts(yf)});
  },[p.data.join(','),p.color]);
  return html`<div class="chwrap"><canvas ref=${ref}></canvas></div>`;
}
function DualLine(p) {
  var yf=p.yFmt||function(v){return v;};
  var ref=useChart(function(c){return new Chart(c,{type:'line',
    data:{labels:p.labels,datasets:[
      {label:p.l1,data:p.d1,borderColor:p.c1,backgroundColor:p.c1+'18',fill:true,tension:.4,pointRadius:0,borderWidth:2},
      {label:p.l2,data:p.d2,borderColor:p.c2,fill:false,tension:.4,pointRadius:0,borderWidth:2,borderDash:[5,4]},
    ]},options:mkOpts(yf)});
  },[p.d1.join(','),p.d2.join(',')]);
  return html`<div class="chwrap"><canvas ref=${ref}></canvas></div>`;
}
function BarChart(p) {
  var yf=p.yFmt||function(v){return v;};
  var ref=useChart(function(c){return new Chart(c,{type:'bar',
    data:{labels:p.labels,datasets:[{data:p.data,
      backgroundColor:p.data.map(function(v){return v>=0?'rgba(240,180,41,.7)':'rgba(248,113,113,.7)';}),
      borderColor:p.data.map(function(v){return v>=0?'#f0b429':'#f87171';}),borderWidth:1,borderRadius:3}]},
    options:mkOpts(yf)});
  },[p.data.join(',')]);
  return html`<div class="chwrap"><canvas ref=${ref}></canvas></div>`;
}
function MultiLine(p) {
  var yf=p.yFmt||function(v){return v;};
  var key=p.datasets.map(function(d){return d.data.join(',');}).join('|');
  var ref=useChart(function(c){return new Chart(c,{type:'line',data:{labels:p.labels,datasets:p.datasets},options:mkOpts(yf)});
  },[key]);
  return html`<div class="chwrap"><canvas ref=${ref}></canvas></div>`;
}
function DonutChart(p) {
  var ref=useChart(function(c){return new Chart(c,{type:'doughnut',
    data:{labels:p.segs.map(function(s){return s.l;}),datasets:[{
      data:p.segs.map(function(s){return s.v;}),
      backgroundColor:p.segs.map(function(s){return s.c;}),
      borderColor:'#0b0f1a',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'70%',
      plugins:{legend:{position:'right',labels:{color:'#8892b0',font:{size:12,family:"'Outfit'"},boxWidth:10,padding:10}},
               tooltip:{backgroundColor:'#1a2038',callbacks:{label:function(ctx){return' '+ff(ctx.raw);}}}}
    }});
  },[p.segs.map(function(s){return s.v;}).join(',')]);
  return html`<div style="position:relative;height:170px"><canvas ref=${ref}></canvas></div>`;
}

var CGIDS={BNB:'binancecoin',BTC:'bitcoin',ETH:'ethereum',SOL:'solana',XRP:'ripple',DOT:'polkadot',AVAX:'avalanche-2',DOGE:'dogecoin'};

function TabInvest(p) {
  var s=p.s,c=p.c,setS=p.setS;
  var manualPx=s.manualPx||{};
  var _lp=useState({});var livePx=_lp[0],setLivePx=_lp[1];
  var _ls=useState('loading');var liveStatus=_ls[0],setLiveStatus=_ls[1];
  var _lt=useState(null);var lastUp=_lt[0],setLastUp=_lt[1];
  var _et=useState(null);var editTkr=_et[0],setEditTkr=_et[1];
  var _ev=useState('');var editVal=_ev[0],setEditVal=_ev[1];

  var PCACHE_KEY='findash_pxcache';
  function fetchLive(){
    setLiveStatus('loading');
    var cgIds=CRYPTO.map(function(coin){return CGIDS[coin.t];}).filter(Boolean).join(',');
    var newPx={};var anyLive=false;
    var cReq=fetch('https://api.coingecko.com/api/v3/simple/price?ids='+cgIds+'&vs_currencies=aud&include_24hr_change=true')
      .then(function(r){return r.json();})
      .then(function(d){
        CRYPTO.forEach(function(coin){var id=CGIDS[coin.t];if(d[id]){newPx[coin.t]={price:d[id].aud,chg:d[id].aud_24h_change||0,live:true};anyLive=true;}});
      }).catch(function(){});
    var tickers=US.map(function(st){return{t:st.t,isUS:true};}).concat(ASX.map(function(st){return{t:st.t,isUS:false};}));
    var endpoints=['https://query2.finance.yahoo.com/v8/finance/chart/','https://query1.finance.yahoo.com/v8/finance/chart/'];
    var sReqs=tickers.map(function(tk){
      function tryEndpoint(i){
        if(i>=endpoints.length)return Promise.resolve();
        return fetch(endpoints[i]+tk.t+'?interval=1d&range=1d&includePrePost=false')
          .then(function(r){return r.json();})
          .then(function(d){
            var m=((d.chart||{}).result||[{}])[0].meta||{};
            if(m.regularMarketPrice){
              var chg=m.previousClose?(m.regularMarketPrice-m.previousClose)/m.previousClose*100:0;
              newPx[tk.t]={price:m.regularMarketPrice,chg:chg,live:true,usd:tk.isUS};anyLive=true;
            } else { return tryEndpoint(i+1); }
          }).catch(function(){return tryEndpoint(i+1);});
      }
      return tryEndpoint(0);
    });
    Promise.all([cReq].concat(sReqs)).then(function(){
      if(anyLive){
        var now=new Date();
        localStorage.setItem(PCACHE_KEY,JSON.stringify({px:newPx,ts:now.getTime()}));
        setLivePx(newPx);setLiveStatus('live');setLastUp(now);
      } else {
        var cached=null;try{cached=JSON.parse(localStorage.getItem(PCACHE_KEY));}catch(e){}
        if(cached&&cached.px){setLivePx(cached.px);setLastUp(new Date(cached.ts));setLiveStatus('cached');}
        else setLiveStatus('offline');
      }
    });
  }
  useEffect(function(){
    var cached=null;try{cached=JSON.parse(localStorage.getItem(PCACHE_KEY));}catch(e){}
    if(cached&&cached.px&&(Date.now()-cached.ts)<7*24*3600*1000){
      setLivePx(cached.px);setLastUp(new Date(cached.ts));setLiveStatus('cached');
    }
    fetchLive();
    var iv=setInterval(fetchLive,300000);return function(){clearInterval(iv);};
  },[]);

  function liveVal(ticker,qty,audusd){
    var lp=livePx[ticker];if(!lp||!lp.live)return null;
    return lp.usd?(lp.price*qty/audusd):(lp.price*qty);
  }
  function liveRow(ticker){return livePx[ticker]&&livePx[ticker].live?livePx[ticker]:null;}
  var au=s.audusd>0?s.audusd:1;
  function effUS(st){var lv=liveVal(st.t,st.qty,au);if(lv!==null)return lv;if(manualPx[st.t]!=null)return manualPx[st.t];return st.u/au;}
  function effASX(st){var lv=liveVal(st.t,st.qty,au);if(lv!==null)return lv;if(manualPx[st.t]!=null)return manualPx[st.t];return st.v;}
  function effCrypto(coin){var lv=liveVal(coin.t,coin.qty,au);if(lv!==null)return lv;if(manualPx[coin.t]!=null)return manualPx[coin.t];return coin.v;}

  var statusLabel=liveStatus==='loading'?'Fetching…':liveStatus==='live'?('Live · '+lastUp.toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'})):liveStatus==='cached'?('Cached · '+lastUp.toLocaleDateString('en-AU',{day:'numeric',month:'short'})):'Offline · tap ✎ to update';
  var statusCol=liveStatus==='live'?'var(--green)':liveStatus==='loading'?'var(--muted)':liveStatus==='cached'?'var(--blue)':'var(--gold)';
  var hasManual=Object.keys(manualPx).length>0;

  var usTotal=US.reduce(function(a,st){return a+effUS(st);},0);
  var asxTotal=ASX.reduce(function(a,st){return a+effASX(st);},0);

  function invRow(ticker,val,chg,isLive,isManual,sub,left){

    return html`<div class="inv-row">
      <div style="display:flex;align-items:center;gap:8px;flex:1">${left}</div>

          <button class="pe-ok" onClick=${function(){savePx(ticker,editVal);}}>✓</button>

        </div>
      `:html`
        <div style="text-align:right;flex-shrink:0;display:flex;align-items:center;gap:3px">
          <div><div class="sm-num">${ff(val)}</div><div style="font-size:12px;color:${cc(chg)}">${pc(chg)}${isLive?' 24h':isManual?' manual':''}</div></div>
          <span class="edit-ic" onClick=${function(){startEdit(ticker,val);}}>✎</span>
        </div>
      `}
    </div>`;

  return html`

        <div class="page-title" style="margin-bottom:0">Investments</div>

          <span>✎ Manual prices active on ${Object.keys(manualPx).length} holding${Object.keys(manualPx).length!==1?'s':''}</span>
          <span style="color:var(--red);cursor:pointer" onClick=${function(){var next=Object.assign({},s,{manualPx:{}});localStorage.setItem(SKEY,JSON.stringify(next));setS(next);}}>Clear all</span>
        </div>`}

      <div class="card">
        <div class="lbl" style="margin-bottom:10px">TOTAL PORTFOLIO BREAKDOWN</div>
        <${DonutChart} segs=${[{l:'Superannuation',v:s.superBal,c:'#60a5fa'},{l:'US Stocks',v:usTotal,c:'#f0b429'},{l:'ASX Shares',v:asxTotal,c:'#34d399'},{l:'Crypto',v:cryptoTotal,c:'#a78bfa'}]} />
        <div class="div" style="margin:10px 0"></div>
        <div class="fb"><div class="lbl">TOTAL (EX-PROPERTY)</div><div style="font-family:var(--mono);font-size:16px;color:var(--gold);font-weight:700">${ff(s.superBal+usTotal+asxTotal+cryptoTotal)}</div></div>
      </div>

      <div class="sec">Superannuation</div>
      <div class="card" style="background:rgba(96,165,250,.04);border-color:rgba(96,165,250,.25)">
        <div class="fb">
          <div><div style="font-weight:800;font-size:16px;color:var(--blue)">Super Fund</div><div style="font-size:13px;color:var(--muted);margin-top:2px">SGC 11.5% · $${s.salary.toLocaleString()} salary</div></div>
          <div style="text-align:right"><div class="sm-num" style="color:var(--blue)">${ff(s.superBal)}</div><div style="font-size:12px;color:var(--muted)">+${ff(s.superContrib)}/yr</div></div>
        </div>
        <div class="div"></div>

// ─── LOAN REPAYMENT CALCULATOR ───────────────────────────────
var LKEY='findash_loan_v1';
var LDEF={amt:500000,rate:6.34,years:30,freq:'monthly',extra:0};
var FREQ={weekly:{ppy:52,suf:'/wk',lbl:'Weekly'},fortnightly:{ppy:26,suf:'/fn',lbl:'Fortnightly'},monthly:{ppy:12,suf:'/mo',lbl:'Monthly'}};

// Simulate an amortisation schedule; returns period count, total interest
// and the balance sampled at each year boundary (for charting).
function amortize(P,pr,ppy,pay,extra,maxN){
  var bal=P,tot=0,k=0,yearly=[Math.round(P)];
  while(bal>0.005&&k<maxN){
    var i=bal*pr;tot+=i;
    bal=Math.max(0,bal+i-(pay+extra));
    k++;
    if(k%ppy===0)yearly.push(Math.round(bal));
  }
  if(k%ppy!==0)yearly.push(Math.round(bal));
  return {periods:k,interest:tot,yearly:yearly};
}
function loanCalc(l){
  var P=Math.max(0,+l.amt||0),rate=Math.max(0,+l.rate||0),extra=Math.max(0,+l.extra||0);
  var yrs=Math.min(50,Math.max(1,Math.round(+l.years)||1));
  var f=FREQ[l.freq]||FREQ.monthly;
  var n=yrs*f.ppy,pr=rate/100/f.ppy;
  var pay=P>0?(pr>0?P*pr/(1-Math.pow(1+pr,-n)):P/n):0;
  var base=amortize(P,pr,f.ppy,pay,0,n);
  var ex=extra>0&&P>0?amortize(P,pr,f.ppy,pay,extra,n):null;
  return {P:P,f:f,pay:pay,base:base,ex:ex,extra:extra,
    totInt:base.interest,totPaid:P+base.interest,
    exInt:ex?ex.interest:0,intSaved:ex?base.interest-ex.interest:0};
}
function addMonths(m){var d=new Date();d.setMonth(d.getMonth()+m);return d;}
function yrmo(months){var y=Math.floor(months/12),m=months%12;return(y>0?y+'yr ':'')+(m>0||y===0?m+'mo':'');}

function LoanCalc(p){
  var s=p.s;
  var st=useState(function(){try{var d=JSON.parse(localStorage.getItem(LKEY));return d?Object.assign({},LDEF,d):LDEF;}catch(e){return LDEF;}});

  function up(patch){setL(function(prev){var n=Object.assign({},prev,patch);try{localStorage.setItem(LKEY,JSON.stringify(n));}catch(e){}return n;});}
  var r=useMemo(function(){return loanCalc(l);},[l]);
  var baseMonths=Math.round(r.base.periods/r.f.ppy*12);
  var exMonths=r.ex?Math.round(r.ex.periods/r.f.ppy*12):0;
  var basePayoff=addMonths(baseMonths);
  var exPayoff=r.ex?addMonths(exMonths):null;
  var yrNow=new Date().getFullYear();
  var lbls=r.base.yearly.map(function(_,i){return "'"+String(yrNow+i).slice(2);});
  var exYearly=r.ex?r.base.yearly.map(function(_,i){return r.ex.yearly[i]!=null?r.ex.yearly[i]:0;}):null;
  var vf=function(v){return v>=1e6?'$'+(v/1e6).toFixed(2)+'M':'$'+(v/1e3).toFixed(0)+'k';};

          ${Object.keys(FREQ).map(function(k){
            return html`<button class=${'pill'+(l.freq===k?' on':'')} onClick=${function(){up({freq:k});}}>${FREQ[k].lbl}</button>`;
          })}
        </div>
        ${[['Loan Amount ($)','amt','1000'],['Interest Rate (% p.a.)','rate','0.01'],['Term (years)','years','1'],['Extra Repayment ($'+r.f.suf+')','extra','10']].map(function(row){
          return html`<div class="si">
            <div style="font-size:14px">${row[0]}</div>
            <input class="si-in" type="number" step=${row[2]} min="0" value=${l[row[1]]} onInput=${function(e){var o={};o[row[1]]=e.target.value;up(o);}} />
          </div>`;
        })}
      </div>

      <div class="card" style="background:linear-gradient(135deg,var(--gold-bg),rgba(52,211,153,.04));border-color:rgba(240,180,41,.3)">
        <div class="lbl" style="color:var(--gold)">${r.f.lbl.toUpperCase()} REPAYMENT</div>
        <div class="big-num" style="margin-top:6px">${ff(r.pay)}<span style="font-size:16px;color:var(--muted);font-weight:400">${r.f.suf}</span></div>
        <div class="div"></div>
        <div class="g3">
          ${[['Total Interest',ff(r.totInt),'var(--red)'],['Total Repaid',ff(r.totPaid),'var(--text)'],['Paid Off',basePayoff.toLocaleDateString('en-AU',dOpt),'var(--gold)']].map(function(x){
            return html`<div class="sb"><div class="lbl" style="font-size:11px">${x[0]}</div><div style="font-family:var(--mono);font-size:14px;color:${x[2]};font-weight:700;margin-top:2px">${x[1]}</div></div>`;

      ${r.ex&&html`

          <div class="fb"><div style="font-weight:800;font-size:16px;color:var(--green)">With extra ${ff(r.extra)}${r.f.suf}</div><span class="tag tag-green">Savings</span></div>
          <div class="g2" style="margin-top:12px">
            ${[['Interest Saved',ff(r.intSaved),'var(--green)'],['Time Saved',yrmo(baseMonths-exMonths),'var(--gold)'],['New Payoff',exPayoff.toLocaleDateString('en-AU',dOpt),'var(--text)'],['New Total Interest',ff(r.exInt),'var(--muted)']].map(function(x){

            </div>`

      </div>
      <div style="font-size:13px;color:var(--muted);text-align:center;padding:6px 0">Estimates only — excludes fees, offset accounts and rate changes</div>

var CONTINENTS = {AF:'Africa',AS:'Asia',EU:'Europe',NA:'Americas',SA:'South America',OC:'Oceania'};
var CONT_ORDER = ['EU','AS','AF','NA','SA','OC'];

function TabTravel(p) {
  var s=p.s, setS=p.setS;
  var qs=useState(''); var q=qs[0],setQ=qs[1];
  var vs=useState('all'); var view=vs[0],setView=vs[1];

  var visitedSet={}, wishlistSet={};
  (s.travel.visited||[]).forEach(function(c){visitedSet[c]=true;});
  (s.travel.wishlist||[]).forEach(function(c){wishlistSet[c]=true;});

  function toggle(code) {
    var v=(s.travel.visited||[]).slice(), w=(s.travel.wishlist||[]).slice();
    var inV=visitedSet[code], inW=wishlistSet[code];
    if(!inV&&!inW)       { v.push(code); }
    else if(inV)         { v=v.filter(function(c){return c!==code;}); w.push(code); }
    else                 { w=w.filter(function(c){return c!==code;}); }
    var next=Object.assign({},s,{travel:{visited:v,wishlist:w}});
    localStorage.setItem(SKEY,JSON.stringify(next)); setS(next);
  }

  var cStats={};
  COUNTRIES.forEach(function(r){
    var co=r[2];
    if(!cStats[co]) cStats[co]={total:0,visited:0,wishlist:0};
    cStats[co].total++;
    if(visitedSet[r[0]]) cStats[co].visited++;
    if(wishlistSet[r[0]]) cStats[co].wishlist++;
  });
  var totalV=(s.travel.visited||[]).length;
  var totalW=(s.travel.wishlist||[]).length;
  var pct=(totalV/COUNTRIES.length*100).toFixed(1);
  var contsV=CONT_ORDER.filter(function(k){return cStats[k]&&cStats[k].visited>0;}).length;

  var lq=q.toLowerCase();
  var filtered=COUNTRIES.filter(function(r){
    var mq=!lq||(r[1].toLowerCase().indexOf(lq)>-1);
    var mv=view==='all'||(view==='visited'&&visitedSet[r[0]])||(view==='wishlist'&&wishlistSet[r[0]]);
    return mq&&mv;
  });
  var grouped={};
  filtered.forEach(function(r){
    if(!grouped[r[2]]) grouped[r[2]]=[];
    grouped[r[2]].push(r);
  });

  return html`
    <div class="page">
      <div class="page-title">✈ Travel</div>

      <div class="g2" style="margin-bottom:10px">
        <div class="card-sm" style="text-align:center">
          <div style="font-family:var(--mono);font-size:30px;font-weight:800;color:var(--green);line-height:1">${totalV}</div>
          <div class="lbl" style="margin-top:4px">Countries Visited</div>
          <div style="font-size:13px;color:var(--muted);margin-top:3px">${pct}% of world · ${contsV} continent${contsV!==1?'s':''}</div>
        </div>
        <div class="card-sm" style="text-align:center">
          <div style="font-family:var(--mono);font-size:30px;font-weight:800;color:var(--gold);line-height:1">${totalW}</div>
          <div class="lbl" style="margin-top:4px">Wishlist</div>
          <div style="font-size:13px;color:var(--muted);margin-top:3px">Countries to visit</div>
        </div>
      </div>

      <div class="sec">Progress by Continent</div>
      <div class="card" style="padding:14px 14px 6px">
        ${CONT_ORDER.map(function(k){
          var cs=cStats[k]||{total:0,visited:0,wishlist:0};
          var pv=cs.total?(cs.visited/cs.total*100).toFixed(1):0;
          var pw=cs.total?(cs.wishlist/cs.total*100).toFixed(1):0;
          return html`<div style="margin-bottom:10px">
            <div class="fb" style="margin-bottom:2px">
              <span style="font-size:13px;font-weight:700">${CONTINENTS[k]}</span>
              <span style="font-size:12px;color:var(--muted);font-family:var(--mono)">${cs.visited}/${cs.total}</span>
            </div>
            <div class="tr-prg">
              <div class="tr-prg-v" style="width:${pv}%"></div>
              <div class="tr-prg-w" style="width:${pw}%"></div>
            </div>
          </div>`;
        })}
      </div>

      <div class="pills">
        ${[['all','All '+COUNTRIES.length],['visited','Visited '+totalV],['wishlist','Wishlist '+totalW]].map(function(opt){
          return html`<button class=${'pill'+(view===opt[0]?' on':'')} onClick=${function(){setView(opt[0]);}}>${opt[1]}</button>`;
        })}
      </div>

      <input class="tr-search" type="search" placeholder="Search countries…" value=${q} onInput=${function(e){setQ(e.target.value);}} />

      ${CONT_ORDER.filter(function(k){return grouped[k]&&grouped[k].length;}).map(function(k){
        return html`
          <div class="sec">${CONTINENTS[k]}</div>
          <div class="tr-grid">
            ${grouped[k].map(function(r){
              var code=r[0],name=r[1],flag=r[3];
              var isV=visitedSet[code], isW=wishlistSet[code];
              var cls='tr-tile'+(isV?' visited':isW?' wishlist':'');
              return html`<div class=${cls} onClick=${function(){toggle(code);}}>
                ${(isV||isW)&&html`<div class=${'tr-dot'+(isV?' visited':' wishlist')}></div>`}
                <span class="tr-flag">${flag}</span>
                <span class="tr-name">${name}</span>
              </div>`;
            })}
          </div>`;
      })}

      ${filtered.length===0&&html`
        <div style="text-align:center;padding:40px 20px;color:var(--muted)">
          <div style="font-size:34px;margin-bottom:8px">🌍</div>
          <div style="font-size:15px">No countries match "${q}"</div>
        </div>`}

      <div style="font-size:12px;color:var(--muted);text-align:center;padding:16px 0 4px">
        Tap to cycle: none → visited → wishlist → none
      </div>
    </div>`;
}

// ─── APP ROOT ─────────────────────────────────────────────────
var TABS = [
  {id:'overview',  icon:'◈',label:'Overview'},
  {id:'portfolio', icon:'◎',label:'Portfolio'},
  {id:'properties',icon:'⬡',label:'Properties'},
  {id:'invest',    icon:'◉',label:'Invest'},

function App() {
  var ss=useState(function(){try{var d=JSON.parse(localStorage.getItem(SKEY));if(!d)return DEFAULT;d=Object.assign({},DEFAULT,d);if(!d.travel)d.travel={visited:[],wishlist:[]};if(!d.manualPx)d.manualPx={};return d;}catch(e){return DEFAULT;}});
  var s=ss[0],setS=ss[1];
  var ts=useState('overview');var tab=ts[0],setTab=ts[1];
  var ips=useState(null);var ip=ips[0],setIp=ips[1];
  var pvs=useState(false);var priv=pvs[0],setPriv=pvs[1];

  var nowD=new Date();
  var isEOFY=(nowD.getMonth()===5&&nowD.getFullYear()===2026);
  var eofyDays=isEOFY?Math.max(0,Math.round((new Date(2026,5,30)-nowD)/864e5)):0;
  var eofyMs=useState(function(){return isEOFY&&!localStorage.getItem('eofyDism2026');});
  var eofyModal=eofyMs[0],setEofyModal=eofyMs[1];
  function dismissEOFY(){localStorage.setItem('eofyDism2026','1');setEofyModal(false);}

  useEffect(function(){
    function h(e){e.preventDefault();setIp(e);}
    window.addEventListener('beforeinstallprompt',h);
    return function(){window.removeEventListener('beforeinstallprompt',h);};
  },[]);
  var c=useMemo(function(){return calc(s);},[s]);
  function onI(){if(!ip)return;ip.prompt();ip.userChoice.then(function(){setIp(null);});}
  function renderTab(){
    if(tab==='overview')   return html`<${TabOverview}    s=${s} c=${c} ip=${ip} onI=${onI} onEOFY=${function(){setEofyModal(true);}} />`;
    if(tab==='portfolio')  return html`<${TabPortfolio}   s=${s} c=${c} />`;
    if(tab==='properties') return html`<${TabProperties}  s=${s} setS=${setS} />`;
    if(tab==='invest')     return html`<${TabInvest}      s=${s} c=${c} setS=${setS} />`;
    if(tab==='forecast')   return html`<${TabForecast}    s=${s} setS=${setS} />`;
    if(tab==='travel')     return html`<${TabTravel}      s=${s} setS=${setS} />`;
  }
  return html`
    <div>
      <div class="prv-bar"><button class=${'prv-btn'+(priv?' on':'')} onClick=${function(){setPriv(!priv);}} title="Toggle privacy">${priv?'👁':'🙈'}</button></div>
      <div class=${priv?'prv':''}>
        <div key=${tab}>${renderTab()}</div>
        <nav class="nav">
          ${TABS.map(function(t){
            return html`<button class=${'nav-btn'+(tab===t.id?' active':'')} onClick=${function(){setTab(t.id);}}>
              <span class="nav-icon">${t.icon}</span>
              <span class="nav-label">${t.label}</span>
            </button>`;
          })}
        </nav>
      </div>

      ${eofyModal&&html`
        <div class="modal-bg" onClick=${function(e){if(e.target===e.currentTarget)dismissEOFY();}}>
          <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
              <div>
                <div style="font-size:20px;font-weight:800;color:var(--red)">⚠ EOFY Action List</div>
                <div style="font-size:14px;color:var(--muted);margin-top:2px">${eofyDays} day${eofyDays!==1?'s':''} until 30 June 2026</div>
              </div>
              <span class="tag tag-red">${eofyDays}d left</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:18px">
              <div style="background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.25);border-radius:12px;padding:12px">
                <div style="font-size:15px;font-weight:800;color:var(--red);margin-bottom:4px">🔴 Urgent — Due 30 June</div>
                <div style="font-size:15px;font-weight:700">Insurance $2,576.72</div>
                <div style="font-size:13px;color:var(--muted);margin-top:2px">BPAY to Hollard<br/>PLC000397030 — $1,137.79<br/>PLC000396819 — $1,438.93</div>
              </div>

              <div style="background:rgba(240,180,41,.07);border:1px solid rgba(240,180,41,.2);border-radius:12px;padding:12px">
                <div style="font-size:15px;font-weight:800;color:var(--gold);margin-bottom:6px">🟡 Before 30 June</div>
                <div style="font-size:14px;margin-bottom:4px"><b>$3,500 outstanding — Hall & Partners</b><br/><span style="font-size:13px;color:var(--muted)">Confirm payment/invoice before EOFY</span></div>
                <div style="font-size:14px;margin-bottom:4px"><b>2/66 Power Rd gas repair invoice</b><br/><span style="font-size:13px;color:var(--muted)">Immediate deduction if repair complete this FY</span></div>
                <div style="font-size:14px"><b>Split system depreciation — $3,833 @ 20% DV</b><br/><span style="font-size:13px;color:var(--muted)">Add to tax return as declining-value deduction</span></div>
              </div>
            </div>

            <button style="width:100%;padding:14px;background:var(--gold);color:var(--bg);border:none;border-radius:12px;font-family:var(--sans);font-size:16px;font-weight:800;cursor:pointer" onClick=${dismissEOFY}>Got it — dismiss for this EOFY</button>
          </div>
        </div>`}
    </div>`;
}
